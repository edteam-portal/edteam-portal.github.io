<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <title>EDTEAM // DIPLOMATIE</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="shared-utils.js?v=2"></script>
    <script src="son.js?v=1"></script>
    <script src="navigation.js?v=6"></script>

    <style>
        :root { 
            --ed-orange: #FF7100; 
            --ed-orange-dim: rgba(255, 113, 0, 0.2); 
            --ed-orange-glow: rgba(255, 113, 0, 0.5); 
            --ed-blue: #00F0FF; 
            --ed-bg: #020100; 
            --ed-red: #FF3333; 
            --ed-green: #00FF66; 
        }
        body { 
            margin: 0; padding: 0; 
            background-color: var(--ed-bg); 
            background-image: radial-gradient(circle at center, #0a0500 0%, #000 100%); 
            color: var(--ed-orange); 
            font-family: 'Share Tech Mono', monospace; 
            overflow: hidden; height: 100vh; 
            display: flex; align-items: flex-start; justify-content: center; 
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.6); border-left: 1px solid rgba(255, 113, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: var(--ed-orange); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #fff; box-shadow: 0 0 10px var(--ed-orange); }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--ed-orange); box-shadow: 0 0 15px var(--ed-orange-glow), 0 0 5px var(--ed-orange);
            opacity: 0.15; z-index: 9999; pointer-events: none; animation: scanline-anim 8s linear infinite;
        }
        @keyframes scanline-anim { 0% { transform: translateY(-10px); } 100% { transform: translateY(100vh); } }

        #side-menu {
            position: fixed; top: 0; left: 0; height: 100vh; width: 60px;
            background: rgba(10, 10, 10, 0.95); border-right: 1px solid var(--ed-orange-dim);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden; z-index: 2000; display: flex; flex-direction: column; padding-top: 15px;
        }
        #side-menu.open { width: 250px; box-shadow: 5px 0 30px rgba(0,0,0,0.9); border-right: 1px solid var(--ed-orange); }
        
        .nav-link { display: flex; align-items: center; padding: 15px; color: #888; text-decoration: none; white-space: nowrap; transition: 0.2s; border-left: 3px solid transparent; cursor: pointer; }
        .nav-link:hover { color: var(--ed-orange); background: rgba(255, 113, 0, 0.1); border-left: 3px solid var(--ed-orange); }
        .nav-link.active { color: var(--ed-blue); background: rgba(0, 240, 255, 0.05); border-left: 3px solid var(--ed-blue); }
        .nav-icon { min-width: 30px; display: flex; justify-content: center; align-items: center; }
        .nav-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-text { margin-left: 15px; font-weight: bold; letter-spacing: 2px; opacity: 0; transition: opacity 0.2s; font-size: 0.9em; }
        #side-menu.open .nav-text { opacity: 1; transition-delay: 0.1s; }
        .hamburger-btn { margin-bottom: 20px; border-bottom: 1px solid #333; color: var(--ed-orange); }

        .hud-container { 
            width: calc(100% - 60px); max-width: 1920px; height: 95vh; display: flex; flex-direction: column; 
            margin-left: 60px; padding: 20px 30px; box-sizing: border-box;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.menu-open .hud-container { margin-left: 250px; width: calc(100% - 250px); }
        .data-window { flex-grow: 1; overflow-y: auto; padding-right: 10px; }

        /* MODULE DIPLOMATIQUE */
        .diplo-category { background: rgba(10, 5, 0, 0.6); border: 1px solid; border-radius: 4px; padding: 20px; display: flex; flex-direction: column; }
        .diplo-pill { background: rgba(0,0,0,0.6); border: 1px solid; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9em; cursor: pointer; transition: 0.2s; letter-spacing: 1px; user-select: none; }
        .diplo-pill:hover { background: rgba(255,255,255,0.1); box-shadow: 0 0 10px currentColor; transform: translateY(-2px); }
        .diplo-details-panel { display: none; margin-top: 20px; border-top: 1px dashed; padding-top: 20px; animation: fadeIn 0.3s ease-out; }

        .search-input { background: rgba(0, 0, 0, 0.6); border: 1px solid var(--ed-orange); color: #fff; padding: 10px 15px; font-family: 'Share Tech Mono', monospace; font-size: 1em; outline: none; transition: 0.2s; box-sizing: border-box; }
        .search-input:focus { border-color: var(--ed-blue); box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #holo-tooltip { position: fixed; display: none; background: rgba(10, 5, 0, 0.95); border: 1px solid var(--ed-orange); color: #fff; padding: 6px 12px; font-size: 0.85em; z-index: 10000; pointer-events: none; border-radius: 3px; font-weight: bold; letter-spacing: 1px; white-space: nowrap; }

        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 2000;
            padding: 40px; box-sizing: border-box;
        }
        .modal-content { 
            background: rgba(10, 5, 0, 0.95); border: 1px solid var(--ed-orange); padding: 30px; 
            max-width: 600px; width: 100%; color: #ccc; position: relative; 
            max-height: 100%; overflow-y: auto; box-sizing: border-box;
        }
        .modal-close { position: absolute; top: 15px; right: 20px; color: var(--ed-orange); cursor: pointer; font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>

    <div class="scanline"></div>
    <div id="holo-tooltip"></div>
    <nav id="side-menu"></nav>

    <div class="hud-container" id="main-ui" style="display: none; opacity: 0; animation: fadeIn 0.4s ease-out forwards;">
        <main class="data-window" id="display-area">

    <!-- EN-TÊTE ET COMMANDE D'ACTION -->
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--ed-orange-dim); padding-bottom: 15px; margin-bottom: 20px;">
                <h3 style="margin: 0; color: var(--ed-orange); letter-spacing: 2px; font-size: 1.2em;">> REGISTRE DES TRAITÉS & MENACES</h3>
                <button id="btn-nouveau-traite" style="display: none; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--ed-blue); color: var(--ed-blue); padding: 8px 20px; font-family: inherit; font-size: 0.9em; font-weight: bold; cursor: pointer; transition: 0.2s; letter-spacing: 2px;" onclick="preparerNouveauTraite(event)" onmouseenter="if(typeof sonHover === 'function') sonHover()" onmouseover="this.style.background='var(--ed-blue)'; this.style.color='#000';" onmouseout="this.style.background='rgba(0, 240, 255, 0.1)'; this.style.color='var(--ed-blue)';">
                    [ RATIFIER UN TRAITÉ ]
                </button>
            </div>

            <!-- CONTENEURS DIPLOMATIQUES (ZONES DE GLISSER-DÉPOSER) -->
            <div style="display: flex; flex-direction: column; gap: 20px; width: 100%;">
                
                <!-- BLOC ALLIÉS -->
                <div id="zone-drop-allie" class="diplo-category" style="border-color: #00FF66; box-shadow: inset 4px 0 0 #00FF66; transition: 0.3s;"
                     ondragover="allowDropTraite(event)" ondragenter="dragEnterZone(event, '#00FF66')" ondragleave="dragLeaveZone(event)" ondrop="dropTraite(event, 'ALLIE')">
                    <h4 style="color: #00FF66; margin: 0 0 15px 0; letter-spacing: 2px;">🟢 COALITION (ALLIÉS)</h4>
                    <div id="liste-diplo-allies" style="display: flex; flex-wrap: wrap; gap: 10px;">
                        <div style="color: #666; font-style: italic;">Sécurisation des archives...</div>
                    </div>
                    <div id="detail-view-allies" class="diplo-details-panel" style="border-color: #00FF66;"></div>
                </div>

                <!-- BLOC PNA -->
                <div id="zone-drop-pna" class="diplo-category" style="border-color: var(--ed-blue); box-shadow: inset 4px 0 0 var(--ed-blue); transition: 0.3s;"
                     ondragover="allowDropTraite(event)" ondragenter="dragEnterZone(event, 'var(--ed-blue)')" ondragleave="dragLeaveZone(event)" ondrop="dropTraite(event, 'PNA')">
                    <h4 style="color: var(--ed-blue); margin: 0 0 15px 0; letter-spacing: 2px;">🔵 P.N.A (PACTES DE NON-AGRESSION)</h4>
                    <div id="liste-diplo-pna" style="display: flex; flex-wrap: wrap; gap: 10px;">
                        <div style="color: #666; font-style: italic;">Sécurisation des archives...</div>
                    </div>
                    <div id="detail-view-pna" class="diplo-details-panel" style="border-color: var(--ed-blue);"></div>
                </div>

                <!-- BLOC HOSTILES -->
                <div id="zone-drop-hostiles" class="diplo-category" style="border-color: #FF3333; box-shadow: inset 4px 0 0 #FF3333; transition: 0.3s;"
                     ondragover="allowDropTraite(event)" ondragenter="dragEnterZone(event, '#FF3333')" ondragleave="dragLeaveZone(event)" ondrop="dropTraite(event, 'HOSTILE')">
                    <h4 style="color: #FF3333; margin: 0 0 15px 0; letter-spacing: 2px;">🔴 CIBLES HOSTILES</h4>
                    <div id="liste-diplo-hostiles" style="display: flex; flex-wrap: wrap; gap: 10px;">
                        <div style="color: #666; font-style: italic;">Sécurisation des archives...</div>
                    </div>
                    <div id="detail-view-hostiles" class="diplo-details-panel" style="border-color: #FF3333;"></div>
                </div>

            </div>
        </main>
    </div>

    <!-- MODAL : RATIFIER / ÉDITER UN TRAITÉ -->
    <div class="modal-overlay" id="modal-traite" onclick="fermerModal('modal-traite', event)">
        <div class="modal-content" style="max-width: 600px; width: 95%; display: flex; flex-direction: column; background: rgba(10, 5, 0, 0.95); border: 1px solid var(--ed-blue); box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);" onclick="event.stopPropagation()">
            <div class="modal-close" style="color: var(--ed-blue);" onclick="fermerModal('modal-traite')">X</div>
            <div class="modal-title" style="color: var(--ed-blue); border-bottom: 1px solid var(--ed-blue); padding-bottom: 10px; margin-bottom: 25px; font-weight: bold; font-size: 1.2em; letter-spacing: 2px;">✒️ BUREAU DES TRAITÉS</div>
            
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label style="color: var(--ed-blue); font-size: 0.8em; font-weight: bold; letter-spacing: 1px; display: block; margin-bottom: 5px;">NOM DE LA FACTION / ESCADRON (REQUIS) :</label>
                    <input type="text" id="diplo-faction" class="search-input" placeholder="Ex: THE DARK WHEEL" style="border-color: var(--ed-blue); width: 100%; text-transform: uppercase;">
                </div>
                
                <div>
                    <label style="color: var(--ed-orange); font-size: 0.8em; font-weight: bold; letter-spacing: 1px; display: block; margin-bottom: 5px;">TAG DE L'ESCADRON (REQUIS) :</label>
                    <input type="text" id="diplo-tag" class="search-input" placeholder="Ex: DARK" maxlength="4" style="border-color: var(--ed-orange); width: 100%; text-transform: uppercase;">
                </div>
                
                <div>
                    <label style="color: var(--ed-blue); font-size: 0.8em; font-weight: bold; letter-spacing: 1px; display: block; margin-bottom: 5px;">STATUT DIPLOMATIQUE :</label>
                    <select id="diplo-statut" class="search-input" style="border-color: var(--ed-blue); width: 100%; font-weight: bold;">
                        <option value="ALLIE" style="color: #00FF66;">🟢 ALLIÉ (Coalition)</option>
                        <option value="PNA" style="color: var(--ed-blue);">🔵 P.N.A. (Pacte de Non-Agression)</option>
                        <option value="HOSTILE" style="color: #FF3333;">🔴 HOSTILE (Menace / KOS)</option>
                    </select>
                </div>

                <div>
                    <label style="color: var(--ed-blue); font-size: 0.8em; font-weight: bold; letter-spacing: 1px; display: block; margin-bottom: 5px; margin-top: 5px;">DIRECTIVES TACTIQUES (Règles d'engagement) :</label>
                    <textarea id="diplo-directives" class="search-input" placeholder="Ex: Tirer à vue dans LHS 3447. Ne pas attaquer leurs convois de commerce..." style="border-color: var(--ed-blue); width: 100%; height: 80px; resize: vertical;"></textarea>
                </div>
            </div>
            
            <button id="btn-signer-traite" style="background: rgba(0, 240, 255, 0.1); border: 1px solid var(--ed-blue); color: var(--ed-blue); padding: 12px; width: 100%; font-family: 'Share Tech Mono', monospace; font-size: 1.1em; letter-spacing: 2px; cursor: pointer; transition: 0.2s; margin-top: 25px; text-transform: uppercase; font-weight: bold;" onclick="sauvegarderTraite()" onmouseenter="if(typeof sonHover === 'function') sonHover()" onmouseover="this.style.background='var(--ed-blue)'; this.style.color='#000'; this.style.boxShadow='0 0 15px var(--ed-blue)';" onmouseout="this.style.background='rgba(0, 240, 255, 0.1)'; this.style.color='var(--ed-blue)'; this.style.boxShadow='none';">RATIFIER LE TRAITÉ</button>
        </div>
    </div>


    <script>
        const supabaseApp = window.supabaseApp;
        let profilCommandant = null;
        let diploDataCache = [];
        let idTraiteEnEdition = null;

        // ==========================================
        // 1. VÉRIFICATION D'ACCÈS & INITIALISATION
        // ==========================================
        window.addEventListener('load', async () => {
            const { data: { session } } = await supabaseApp.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            // Extraction unique du profil commandant (Requête consolidée)
            const { data } = await chargerProfilAvecCache(supabaseApp, session.user.id);
            if (!data || !data.est_approuve) {
                await supabaseApp.auth.signOut();
                window.location.href = 'index.html';
                return;
            }

            // PAS D'ESCADRON = PAS D'ACCÈS (pilote indépendant)
            if (!data.escadron_id || data.escadron_id === 'INDEPENDANT') {
                window.location.href = 'index.html';
                return;
            }

            // Contrôle d'accréditation anti-recrue
            const rangJeu = parseInt(localStorage.getItem('edteam_rang_jeu') || '3');
            if (rangJeu === 4 && (!data.est_amiral && !data.est_officier)) {
                window.location.href = 'index.html';
                return;
            }
                profilCommandant = data;
                window.profilCommandant = data;

                // Armement des fonctions d'écriture (Amiral, Officier ou Diplomate)
                if (data.est_amiral || data.est_officier || data.est_diplomate) {
                    const btnTraite = document.getElementById('btn-nouveau-traite');
                    if (btnTraite) btnTraite.style.display = 'block';
                }

                // Affichage du BGS si escadron assigné
                if (data.escadron_id) {
                    const navBgs = document.getElementById('nav-bgs-factions');
                    if (navBgs) navBgs.style.display = 'flex';
                }

                // Synchronisation du bandeau supérieur
                if (typeof window.actualiserHeader === 'function') {
                    window.actualiserHeader(data);
                }

                // Déverrouillage visuel du terminal
                const mainUi = document.getElementById('main-ui');
                if (mainUi) {
                    mainUi.style.display = 'flex';
                    mainUi.style.opacity = '1';
                }

                if (typeof window.demarrerSystemLoop === 'function') {
                    window.demarrerSystemLoop();
                }

                chargerDiplomatie();
        });

        // ==========================================
        // 2. MOTEUR DU BUREAU DIPLOMATIQUE
        // ==========================================
        async function chargerDiplomatie() {
            if (!profilCommandant || !profilCommandant.escadron_id) return;
            const containerAllies = document.getElementById('liste-diplo-allies');
            const containerPNA = document.getElementById('liste-diplo-pna');
            const containerHostiles = document.getElementById('liste-diplo-hostiles');

            document.querySelectorAll('.diplo-details-panel').forEach(p => p.style.display = 'none');

            try {
                const { data, error } = await supabaseApp.from('traites_diplomatiques')
                    .select('id, faction_cible, tag, type_relation, directives, signataire_nom')
                    .eq('escadron_id', profilCommandant.escadron_id)
                    .order('faction_cible', { ascending: true });

                if (error) throw error;
                diploDataCache = data || [];

                let htmlAllies = '';
                let htmlPNA = '';
                let htmlHostiles = '';

                diploDataCache.forEach(t => {
                    let color = '#00FF66';
                    let icon = '🤝';
                    if (t.type_relation === 'PNA') { color = 'var(--ed-blue)'; icon = '🛡️'; }
                    else if (t.type_relation === 'HOSTILE') { color = '#FF3333'; icon = '⚔️'; }

                    let dragAttr = '';
                    let cursorStyle = 'cursor: pointer;';
                    if (profilCommandant.est_amiral || profilCommandant.est_officier || profilCommandant.est_diplomate) {
                        dragAttr = `draggable="true" ondragstart="dragStartTraite(event, '${t.id}')"`;
                        cursorStyle = 'cursor: grab;';
                    }

                    const tagStr = t.tag ? ` [${escapeHtml(t.tag.toUpperCase())}]` : '';
                    const pillHtml = `<div class="diplo-pill" style="border-color: ${color}; color: ${color}; ${cursorStyle}" ${dragAttr} onclick="afficherDetailsTraite('${t.id}', '${t.type_relation}')">${icon} ${escapeHtml(t.faction_cible.toUpperCase())}${tagStr}</div>`;

                    if (t.type_relation === 'ALLIE') htmlAllies += pillHtml;
                    else if (t.type_relation === 'PNA') htmlPNA += pillHtml;
                    else if (t.type_relation === 'HOSTILE') htmlHostiles += pillHtml;
                });

                containerAllies.innerHTML = htmlAllies || '<div style="color: #555; font-style: italic; font-size: 0.9em;">Aucune alliance active.</div>';
                containerPNA.innerHTML = htmlPNA || '<div style="color: #555; font-style: italic; font-size: 0.9em;">Aucun P.N.A. enregistré.</div>';
                containerHostiles.innerHTML = htmlHostiles || '<div style="color: #555; font-style: italic; font-size: 0.9em;">Aucune menace déclarée.</div>';

            } catch (e) {
                console.error("> SYS.EDTEAM // Erreur diplomatie :", e);
            }
        }

        window.afficherDetailsTraite = function(idTraite, typeRelation) {
            if (typeof sonClic === 'function') sonClic();
            const traite = diploDataCache.find(x => String(x.id) === String(idTraite));
            if (!traite) return;

            let containerId = 'detail-view-allies';
            let color = '#00FF66';
            if (typeRelation === 'PNA') { containerId = 'detail-view-pna'; color = 'var(--ed-blue)'; }
            else if (typeRelation === 'HOSTILE') { containerId = 'detail-view-hostiles'; color = '#FF3333'; }

            const panel = document.getElementById(containerId);
            if (panel.style.display === 'block' && panel.dataset.currentTraite === String(idTraite)) {
                panel.style.display = 'none';
                panel.dataset.currentTraite = '';
                return;
            }

            let btnActions = '';
            if (profilCommandant.est_amiral || profilCommandant.est_officier || profilCommandant.est_diplomate) {
                btnActions = `
                <div style="display: flex; gap: 10px;">
                    <button style="background: rgba(0, 240, 255, 0.1); border: 1px solid var(--ed-blue); color: var(--ed-blue); padding: 6px 15px; cursor: pointer; font-size: 0.8em; font-weight: bold; transition: 0.2s;" onmouseover="this.style.background='var(--ed-blue)'; this.style.color='#000';" onmouseout="this.style.background='rgba(0, 240, 255, 0.1)'; this.style.color='var(--ed-blue)';" onclick="preparerEditionTraite('${traite.id}')">MODIFIER</button>
                    <button style="background: rgba(255, 51, 51, 0.1); border: 1px solid #FF3333; color: #FF3333; padding: 6px 15px; cursor: pointer; font-size: 0.8em; font-weight: bold; transition: 0.2s;" onmouseover="this.style.background='#FF3333'; this.style.color='#000';" onmouseout="this.style.background='rgba(255, 51, 51, 0.1)'; this.style.color='#FF3333';" onclick="revoquerTraite('${traite.id}')">RÉVOQUER</button>
                </div>`;
            }

            const directives = traite.directives ? escapeHtml(traite.directives).replace(/\n/g, '<br>') : '<span style="color: #666; font-style: italic;">Aucune directive tactique spécifiée.</span>';
            const signataire = escapeHtml((traite.signataire_nom || 'COMMANDEMENT').toUpperCase());

            panel.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
                    <div style="font-size: 1.4em; font-weight: bold; color: #fff; letter-spacing: 1px;">> DOSSIER : ${escapeHtml(traite.faction_cible.toUpperCase())} ${traite.tag ? `[${escapeHtml(traite.tag.toUpperCase())}]` : ''}</div>
                    ${btnActions}
                </div>
                <div style="color: #ccc; font-size: 0.95em; line-height: 1.6; background: rgba(0,0,0,0.5); padding: 15px; border-left: 3px solid ${color};">
                    <strong style="color: ${color}; letter-spacing: 1px; margin-bottom: 10px; display: block;">[ DIRECTIVES & RÈGLES D'ENGAGEMENT ]</strong>
                    ${directives}
                </div>
                <div style="margin-top: 15px; font-size: 0.8em; color: #666; text-align: right;">
                    Dossier ratifié par CMDR ${signataire}
                </div>
            `;

            panel.dataset.currentTraite = String(idTraite);
            document.querySelectorAll('.diplo-details-panel').forEach(p => {
                if (p.id !== containerId) { p.style.display = 'none'; p.dataset.currentTraite = ''; }
            });
            panel.style.display = 'block';
        };

        window.preparerNouveauTraite = function(event) {
            if (typeof sonClic === 'function') sonClic();
            if (event) event.stopPropagation();
            if (typeof hideHoloTooltip === 'function') hideHoloTooltip();

            idTraiteEnEdition = null;
            document.getElementById('diplo-faction').value = "";
            document.getElementById('diplo-tag').value = "";
            document.getElementById('diplo-statut').value = "ALLIE";
            document.getElementById('diplo-directives').value = "";

            const btn = document.getElementById('btn-signer-traite');
            if (btn) btn.innerText = "RATIFIER LE TRAITÉ";
            const titreModal = document.querySelector('#modal-traite .modal-title');
            if (titreModal) titreModal.innerHTML = "✒️ BUREAU DES TRAITÉS";

            document.getElementById('modal-traite').style.display = 'flex';
        };

        window.preparerEditionTraite = function(idTraite) {
            if (typeof sonClic === 'function') sonClic();
            const traite = diploDataCache.find(x => String(x.id) === String(idTraite));
            if (!traite) return;

            idTraiteEnEdition = traite.id;
            document.getElementById('diplo-faction').value = traite.faction_cible;
            document.getElementById('diplo-tag').value = traite.tag || '';
            document.getElementById('diplo-statut').value = traite.type_relation;
            document.getElementById('diplo-directives').value = traite.directives || '';

            const btn = document.getElementById('btn-signer-traite');
            if (btn) btn.innerText = "METTRE À JOUR LE DOSSIER";
            const titreModal = document.querySelector('#modal-traite .modal-title');
            if (titreModal) titreModal.innerHTML = "✒️ MISE À JOUR DU DOSSIER TACTIQUE";

            document.getElementById('modal-traite').style.display = 'flex';
        };

        async function sauvegarderTraite() {
            if (typeof sonClic === 'function') sonClic();
            const faction = document.getElementById('diplo-faction').value.trim();
            const tagFormulaire = document.getElementById('diplo-tag').value.trim().toUpperCase();
            const statut = document.getElementById('diplo-statut').value;
            const directives = document.getElementById('diplo-directives').value.trim();
            const btn = document.getElementById('btn-signer-traite');

            if (!faction || !tagFormulaire) {
                btn.innerText = "ERREUR : NOM ET TAG REQUIS";
                setTimeout(() => btn.innerText = idTraiteEnEdition ? "METTRE À JOUR LE DOSSIER" : "RATIFIER LE TRAITÉ", 2000);
                return;
            }

            btn.innerText = "TRANSMISSION AU NOYAU...";
            btn.style.pointerEvents = "none";

            try {
                const payload = {
                    faction_cible: faction,
                    tag: tagFormulaire || null,
                    type_relation: statut,
                    directives: directives,
                    signataire_nom: profilCommandant.cmdr_nom || 'INCONNU'
                };

                if (idTraiteEnEdition) {
                    const { error } = await supabaseApp.from('traites_diplomatiques').update(payload).eq('id', idTraiteEnEdition);
                    if (error) throw error;
                } else {
                    payload.escadron_id = profilCommandant.escadron_id;
                    const { error } = await supabaseApp.from('traites_diplomatiques').insert([payload]);
                    if (error) throw error;
                }

                if (typeof sonSucces === 'function') sonSucces();
                btn.innerText = idTraiteEnEdition ? "DOSSIER MIS À JOUR" : "TRAITÉ RATIFIÉ";
                btn.style.color = "#00FF66";
                btn.style.borderColor = "#00FF66";

                setTimeout(() => {
                    chargerDiplomatie();
                    fermerModal('modal-traite');
                    idTraiteEnEdition = null;
                    btn.innerText = "RATIFIER LE TRAITÉ";
                    btn.style.color = "var(--ed-blue)";
                    btn.style.borderColor = "var(--ed-blue)";
                    btn.style.pointerEvents = "auto";
                }, 1200);

            } catch (e) {
                console.error("> SYS.EDTEAM // Échec sauvegarde traité :", e);
                btn.innerText = "ÉCHEC SYSTÈME";
                setTimeout(() => {
                    btn.innerText = idTraiteEnEdition ? "METTRE À JOUR LE DOSSIER" : "RATIFIER LE TRAITÉ";
                    btn.style.pointerEvents = "auto";
                }, 2000);
            }
        }

        async function revoquerTraite(idTraite) {
            let confirmation = false;
            if (typeof window.demanderConfirmation === 'function') {
                confirmation = await window.demanderConfirmation(
                    "⚠️ RÉVOCATION DIPLOMATIQUE",
                    "Voulez-vous révoquer ce traité ?<br><br><span style='color: #888;'>Cette action est immédiate et sera propagée sur l'ensemble de la flotte.</span>",
                    "#FF7100"
                );
            } else {
                confirmation = confirm("Voulez-vous révoquer ce traité ?");
            }

            if (!confirmation) return;

            try {
                const { error } = await supabaseApp.from('traites_diplomatiques').delete().eq('id', idTraite);
                if (error) throw error;

                if (typeof sonSucces === 'function') sonSucces();
                chargerDiplomatie();
            } catch (e) {
                console.error("> SYS.EDTEAM // Échec révocation :", e);
            }
        }

        // ==========================================
        // 3. GESTION DU GLISSER-DÉPOSER (DRAG & DROP)
        // ==========================================
        window.dragStartTraite = function(event, idTraite) {
            event.dataTransfer.setData("text/plain", idTraite);
            event.dataTransfer.effectAllowed = "move";
            if (typeof sonHover === 'function') sonHover();
        };

        window.allowDropTraite = function(event) {
            event.preventDefault();
        };

        window.dragEnterZone = function(event, color) {
            event.preventDefault();
            const zone = event.currentTarget;
            zone.style.boxShadow = `inset 0 0 30px ${color}`;
            zone.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
        };

        window.dragLeaveZone = function(event) {
            const zone = event.currentTarget;
            zone.style.backgroundColor = 'rgba(10, 5, 0, 0.6)';
            if (zone.id === 'zone-drop-allie') zone.style.boxShadow = 'inset 4px 0 0 #00FF66';
            if (zone.id === 'zone-drop-pna') zone.style.boxShadow = 'inset 4px 0 0 var(--ed-blue)';
            if (zone.id === 'zone-drop-hostiles') zone.style.boxShadow = 'inset 4px 0 0 #FF3333';
        };

        window.dropTraite = async function(event, nouveauStatut) {
            event.preventDefault();
            dragLeaveZone(event);

            const idTraite = event.dataTransfer.getData("text/plain");
            if (!idTraite) return;

            const traiteActuel = diploDataCache.find(t => String(t.id) === String(idTraite));
            if (traiteActuel && traiteActuel.type_relation === nouveauStatut) return;

            if (typeof sonClic === 'function') sonClic();

            try {
                const { error } = await supabaseApp.from('traites_diplomatiques')
                    .update({ type_relation: nouveauStatut })
                    .eq('id', idTraite);

                if (error) throw error;
                if (typeof sonSucces === 'function') sonSucces();
                chargerDiplomatie();
            } catch (e) {
                console.error("> SYS.EDTEAM // Échec transmission Drag & Drop :", e);
            }
        };
    </script>
    <script src="footer.js?v=6"></script>
</body>
