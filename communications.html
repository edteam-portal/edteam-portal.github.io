<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <title>EDTEAM // Communication</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="shared-utils.js?v=1"></script>
    <script src="navigation.js?v=2"></script>

    <style>
        :root { --ed-orange: #FF7100; --ed-blue: #00F0FF; --ed-bg: #020100; --ed-red: #FF3333; --ed-green: #00FF66; }
        body { margin: 0; padding: 0; background-color: var(--ed-bg); background-image: radial-gradient(circle at center, #0a0500 0%, #000 100%); color: var(--ed-blue); font-family: 'Share Tech Mono', monospace; overflow: hidden; height: 100vh; display: flex; align-items: flex-start; justify-content: center; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.6); border-left: 1px solid rgba(0, 240, 255, 0.2); }
        ::-webkit-scrollbar-thumb { background: var(--ed-blue); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #fff; box-shadow: 0 0 10px var(--ed-blue); }

        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: var(--ed-blue); box-shadow: 0 0 15px rgba(0,240,255,0.5), 0 0 5px var(--ed-blue); opacity: 0.15; z-index: 9999; pointer-events: none; animation: scanline-anim 8s linear infinite; }
        @keyframes scanline-anim { 0% { transform: translateY(-10px); } 100% { transform: translateY(100vh); } }

        @keyframes enveloppeBlink {
            0%, 100% { color: var(--ed-blue); filter: none; }
            50% { color: #fff; filter: drop-shadow(0 0 10px #fff); }
        }

        @keyframes tabBlink {
            0%, 100% { color: var(--ed-blue); text-shadow: none; border-color: rgba(0, 240, 255, 0.2); }
            50% { color: #fff; text-shadow: 0 0 10px #fff; border-color: #fff; box-shadow: inset 0 0 10px rgba(255,255,255,0.5); }
        }

        .alerte-onglet {
            animation: tabBlink 1.5s infinite !important;
            opacity: 1 !important;
        }

        .alerte-enveloppe .nav-icon {
            animation: enveloppeBlink 1s infinite !important;
        }
        .alerte-enveloppe .nav-text {
            color: #fff !important;
            text-shadow: 0 0 10px #fff;
        }

        /* MENU LATÉRAL */
        #side-menu { position: fixed; top: 0; left: 0; height: 100vh; width: 60px; background: rgba(10, 10, 10, 0.95); border-right: 1px solid rgba(0, 240, 255, 0.2); transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; z-index: 2000; display: flex; flex-direction: column; padding-top: 15px; }
        #side-menu.open { width: 250px; box-shadow: 5px 0 30px rgba(0,0,0,0.9); border-right: 1px solid var(--ed-blue); }
        .nav-link { display: flex; align-items: center; padding: 15px; color: #888; text-decoration: none; white-space: nowrap; transition: 0.2s; border-left: 3px solid transparent; cursor: pointer; }
        .nav-link:hover { color: var(--ed-blue); background: rgba(0, 240, 255, 0.1); border-left: 3px solid var(--ed-blue); }
        .nav-link.active { color: var(--ed-blue); background: rgba(0, 240, 255, 0.05); border-left: 3px solid var(--ed-blue); }
        .nav-icon { min-width: 30px; display: flex; justify-content: center; align-items: center; }
        .nav-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-text { margin-left: 15px; font-weight: bold; letter-spacing: 2px; opacity: 0; transition: opacity 0.2s; font-size: 0.9em; }
        #side-menu.open .nav-text { opacity: 1; transition-delay: 0.1s; }
        .hamburger-btn { margin-bottom: 20px; border-bottom: 1px solid #333; color: var(--ed-blue); }

        .hud-container { width: calc(100% - 60px); max-width: 1920px; height: 95vh; display: flex; flex-direction: column; margin-left: 60px; padding: 20px 30px; box-sizing: border-box; transition: margin-left 0.3s, width 0.3s; }
        body.menu-open .hud-container { margin-left: 250px; width: calc(100% - 250px); }

        /* HEADER CYAN ÉPURÉ */
        .hud-header { display: flex; flex-direction: row; align-items: stretch; justify-content: space-between; gap: 15px; margin-bottom: 15px; width: 100%; border-bottom: 2px solid var(--ed-blue); padding-bottom: 15px; }
        .app-logo { height: 45px; width: 45px; filter: drop-shadow(0 0 5px rgba(0,240,255,0.5)); transition: 0.3s; }
        .info-btn { cursor: pointer; font-weight: bold; transition: 0.2s; display: inline-block; padding: 0 4px; }
        .info-btn:hover { color: #fff !important; text-shadow: 0 0 8px currentColor; transform: scale(1.1); }

        /* ONGLETS */
        .tab-bar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 15px; }
        .tab-btn { background: transparent; border: 1px solid rgba(0, 240, 255, 0.2); border-bottom: none; color: var(--ed-blue); padding: 8px 30px; font-family: 'Share Tech Mono', monospace; font-size: 1.05em; letter-spacing: 2px; cursor: pointer; opacity: 0.5; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); transition: 0.2s; }
        .tab-btn:hover { background: rgba(0, 240, 255, 0.1); opacity: 0.8; }
        .tab-btn.active { opacity: 1; background: var(--ed-blue); color: #000; font-weight: bold; }

        /* TERMINAL CRT */
        .crt-terminal { flex-grow: 1; display: flex; flex-direction: column; background-color: #03080A; background-image: linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px); background-size: 20px 20px; border: 1px solid var(--ed-blue); box-shadow: inset 0 0 40px rgba(0, 240, 255, 0.1); position: relative; overflow: hidden; }
        .crt-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%); background-size: 100% 4px; z-index: 10; pointer-events: none; }
        
        .message-feed { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 5; scroll-behavior: smooth; }
        
        .msg-line { display: flex; flex-wrap: wrap; align-items: baseline; font-size: 0.95em; line-height: 1.4; animation: typeIn 0.2s ease-out; position: relative; padding: 4px 8px; border-left: 2px solid transparent; }
        .msg-line:hover { background: rgba(255,255,255,0.02); }
        .msg-line.urgent { border-left-color: var(--ed-red); background: rgba(255,51,51,0.05); }
        .msg-time { color: #555; margin-right: 10px; font-size: 0.85em; }
        .msg-author { font-weight: bold; margin-right: 8px; }
        .msg-channel { margin-right: 8px; font-size: 0.85em; letter-spacing: 1px; }
        .msg-text { color: #ccc; word-break: break-word; flex-grow: 1; }
        .msg-delete { color: #666; cursor: pointer; font-size: 0.8em; margin-left: 10px; opacity: 0; transition: 0.2s; }
        .msg-line:hover .msg-delete { opacity: 1; }
        .msg-delete:hover { color: var(--ed-red); }

        @keyframes typeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        /* ZONE DE SAISIE */
        .terminal-input-area { border-top: 1px dashed var(--ed-blue); padding: 15px 20px; display: flex; gap: 15px; background: rgba(0, 240, 255, 0.05); align-items: center; z-index: 5; }
        .input-prompt { color: var(--ed-blue); font-weight: bold; font-size: 1.2em; animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        .comms-input { flex-grow: 1; background: transparent; border: none; color: #fff; font-family: 'Share Tech Mono', monospace; font-size: 1.1em; outline: none; caret-color: var(--ed-blue); }
        .comms-input::placeholder { color: #444; }
        
        .char-counter { color: #666; font-size: 0.8em; min-width: 60px; text-align: right; }
        
        .btn-urgent { background: transparent; border: 1px solid #555; color: #555; padding: 8px 15px; font-family: inherit; font-size: 0.9em; font-weight: bold; cursor: pointer; transition: 0.2s; letter-spacing: 1px; }
        .btn-urgent.active { background: rgba(255, 51, 51, 0.1); border-color: var(--ed-red); color: var(--ed-red); box-shadow: inset 0 0 10px rgba(255,51,51,0.3), 0 0 10px rgba(255,51,51,0.2); animation: alertPulse 1.5s infinite; }
        
        .btn-send { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--ed-blue); color: var(--ed-blue); padding: 8px 25px; font-family: inherit; font-size: 1em; font-weight: bold; cursor: pointer; transition: 0.2s; letter-spacing: 2px; }
        .btn-send:hover { background: var(--ed-blue); color: #000; box-shadow: 0 0 15px var(--ed-blue); }
        .btn-send:disabled { opacity: 0.3; cursor: not-allowed; }

        /* SÉLECTEUR DESTINATAIRE PRIVÉ */
        #select-destinataire { background: rgba(0,0,0,0.8); border: 1px solid var(--ed-blue); color: var(--ed-blue); font-family: inherit; padding: 8px; outline: none; display: none; }
        #select-destinataire option { background: #000; color: #fff; }

        /* MODALES ET POPUPS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 3000; backdrop-filter: blur(4px); }
        .modal-content { background: rgba(10, 5, 0, 0.95); border: 1px solid var(--ed-blue); padding: 30px; max-width: 600px; min-width: 400px; color: #ccc; line-height: 1.6; position: relative; box-shadow: 0 0 30px rgba(0, 240, 255, 0.1); }
        .modal-title { color: var(--ed-blue); font-size: 1.5em; border-bottom: 1px solid rgba(0, 240, 255, 0.3); padding-bottom: 10px; margin-bottom: 15px; letter-spacing: 2px; }
        .modal-close { position: absolute; top: 15px; right: 20px; color: var(--ed-blue); cursor: pointer; font-size: 1.2em; font-weight: bold; transition: 0.2s; }
        .modal-close:hover { color: #fff; transform: scale(1.2); }

        @keyframes alertPulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* =========================================
           PROTOCOLE FAILSAFE (UNIFIÉ)
           ========================================= */
        .failsafe-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(5px); }
        .failsafe-content { border: 2px solid #FF0000; background: rgba(10, 0, 0, 0.95); padding: 40px 60px; text-align: center; box-shadow: 0 0 30px rgba(255, 0, 0, 0.3); animation: failsafe-pulse 2s infinite; }
        @keyframes failsafe-pulse { 0%, 100% { box-shadow: 0 0 20px rgba(255,0,0,0.2); } 50% { box-shadow: 0 0 60px rgba(255,0,0,0.6); } }
        .fs-page { display: none; }
        
        .fs-auth-btn { background: rgba(255, 113, 0, 0.1); border: 1px solid var(--ed-orange); color: var(--ed-orange); padding: 12px; font-family: 'Share Tech Mono', monospace; font-size: 1.1em; letter-spacing: 2px; cursor: pointer; transition: 0.2s; text-transform: uppercase; box-sizing: border-box; width: 100%; margin-bottom: 10px; display: block; text-align: center; text-decoration: none; }
        .fs-auth-btn:hover { background: var(--ed-orange) !important; color: #000 !important; box-shadow: 0 0 15px var(--ed-orange) !important; }

        #holo-tooltip { position: fixed; display: none; background: rgba(10, 5, 0, 0.95); border: 1px solid var(--ed-orange); color: #fff; padding: 8px 12px; font-size: 0.85em; z-index: 100000; pointer-events: none; border-radius: 3px; font-weight: bold; letter-spacing: 1px; white-space: nowrap; box-shadow: 0 0 15px rgba(0,0,0,0.8); }

    </style>

<body onload="document.getElementById('main-ui').style.opacity='1';">

    <div class="scanline"></div>
    <div id="holo-tooltip"></div>

    <nav id="side-menu"></nav>

    <!-- ZONE PRINCIPALE -->
    <div class="hud-container" id="main-ui" style="opacity: 0; transition: opacity 0.5s ease-out;">

        <!-- ONGLETS DES CANAUX -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; gap: 15px;">
            <nav class="tab-bar" style="margin-bottom: 0;">
            <button id="btn-tab-global" class="tab-btn active" onclick="changerCanal('GLOBAL', this)" onmouseenter="sonHover()">FRÉQUENCE OUVERTE</button>
            <button id="btn-tab-escadron" class="tab-btn" style="display: none;" onclick="changerCanal('ESCADRON', this)" onmouseenter="sonHover()">CANAL ESCADRON</button>
            <button id="btn-tab-prive" class="tab-btn" onclick="changerCanal('PRIVE', this)" onmouseenter="sonHover()">TRANSMISSIONS PRIVÉES <span id="badge-unread" style="color:#FF3333; display:none;">(•)</span></button>
            </nav>
        </div>

        <!-- TERMINAL CRT -->
        <div class="crt-terminal" onclick="retirerAlerteEnveloppe()">
            <div class="crt-overlay"></div>

            <div class="message-feed" id="message-feed">
                <div style="color: #555; font-style: italic; text-align: center; margin-top: 40px;">Synchronisation des archives...</div>
            </div>

            <div class="terminal-input-area">
                <span class="input-prompt">>_</span>
                
                <select id="select-destinataire">
                    <option value="">-- SÉLECTIONNEZ UN DESTINATAIRE --</option>
                </select>

                <textarea id="comms-input" class="comms-input" placeholder="Saisissez votre télégramme ici..." maxlength="140" rows="1" onkeydown="if(event.key==='Enter'){event.preventDefault(); transmettreMessage();}" onkeyup="updateCounter(event)" style="resize: none; height: 24px; line-height: 24px; overflow: hidden; white-space: nowrap;"></textarea>
                
                <span class="char-counter" id="char-counter">0/140</span>
                
                <button id="btn-urgent" class="btn-urgent" onclick="toggleUrgent()" onmouseenter="sonHover()" title="Marquer le message comme prioritaire (Alerte Visuelle)">[!] URGENT</button>
                <button id="btn-send" class="btn-send" onclick="transmettreMessage()" onmouseenter="sonHover()">TRANSMETTRE</button>
            </div>
        </div>

    
    </div>

    <!-- AUDIO ENGINE & LOGIC -->
    <script>

        function navFailsafe(pageId) {
            sonClic();
            document.querySelectorAll('.fs-page').forEach(el => el.style.display = 'none');
            document.getElementById(pageId).style.display = 'block';
        }

        // SUPABASE INIT
        const supabaseApp = window.supabaseApp;

        let profilCommandant = null;
        let canalActif = 'GLOBAL';
        let isUrgent = false;
        let listePilotes = [];

        // ==========================================
        // HORLOGE GALACTIQUE (SYNCHRO LOCALE SILENCIEUSE)
        // ==========================================
        let dernierTick = new Date(0);
        let prochainTick = new Date();

        async function synchroniserHorloge() {
            try {
                // Lecture silencieuse de la date officielle sur Supabase
                const { data, error } = await supabaseApp.from('etat_serveur').select('dernier_tick').eq('id', 1).single();
                if (!error && data && data.dernier_tick) {
                    dernierTick = new Date(data.dernier_tick);
                }
            } catch (err) { console.warn("SYS.EDTEAM : Erreur lecture Supabase."); }
            
            if (dernierTick.getTime() === 0 || isNaN(dernierTick.getTime())) dernierTick = new Date(); 
            prochainTick = new Date(dernierTick.getTime() + 24 * 60 * 60 * 1000);
        }
        
        // Caches du Renseignement Tactique
        let cacheRegistreTactique = [];
        let cacheTraitesDiplo = [];

        // =========================================
        // BOUCLE DE SÉCURITÉ (FAILSAFE ULTRA-LÉGER)
        // =========================================
        let isSystemLooping = false;
        let wasEdmcOnline = true; // <-- La variable manquante est ici !

        window.addEventListener('load', async () => {
            try {
                const { data: { session } } = await supabaseApp.auth.getSession();
                if (!session) { window.location.href = 'index.html'; return; }
                
                const { data, error } = await chargerProfilAvecCache(supabaseApp, session.user.id);
                
                if (error || !data || !data.est_approuve) {
                    window.location.href = 'index.html';
                    return;
                }

                // 🛑 SÉCURITÉ : REDIRECTION SI PROFIL INCOMPLET
                if (!data.cmdr_nom) {
                    window.location.href = 'index.html';
                    return; 
                }

                profilCommandant = data;
                if (typeof enregistrerTelemetrie === 'function') enregistrerTelemetrie('page', 'comms');
                if (typeof synchroniserTelemetrie === 'function') synchroniserTelemetrie();

                // AFFICHAGE DU BOUTON AMIRAUTÉ
                if (data.est_amiral || data.est_directeur) {
                    const navAmiraute = document.getElementById('nav-bureau-amiraute');
                    if (navAmiraute) navAmiraute.style.display = 'flex';
                    if (typeof actualiserBadgeAmiraute === 'function') actualiserBadgeAmiraute();
                }

                // AFFICHAGE DU BGS ET DES COMMS ESCADRON
                if (data.escadron_id) {
                    const navBgs = document.getElementById('nav-bgs-factions');
                    if (navBgs) navBgs.style.display = 'flex';
                    
                    const btnEscadron = document.getElementById('btn-tab-escadron');
                    if (btnEscadron) btnEscadron.style.display = 'inline-block';
                }

                // --- INJECTION DES DONNÉES DANS LE HEADER ---
                window.actualiserHeader(data);
                
                if (data.cle_api) {
                    const keyDisplay = document.getElementById('api-key-display');
                    if (keyDisplay) keyDisplay.innerText = data.cle_api;
                }
                
                // --- SÉQUENCE D'ALLUMAGE SÉCURISÉE ---
                await chargerListePilotes();
                await chargerRenseignementLocal();
                await synchroniserHorloge(); // <-- Synchronisation silencieuse du Tick via Supabase
                await chargerHistorique();    // <-- Affiche uniquement les messages propres
                ecouterTransmissions();
                ecouterEffortsBGS(); // <-- Activation du radar d'efforts filtré

                // ---> AJOUTE LE LANCEMENT DU SCANNEUR JUSTE ICI <---
            await verifierOngletsNonLus();
            
            // Démarrage du radar et de la sécurité Failsafe
            // (La boucle systemLoop est réservée au Quartier Général)

            } catch(e) {
                console.error("Erreur critique au démarrage :", e);
            }
        });

        // --- GESTION DE L'INTERFACE ---
        function changerCanal(nouveauCanal, btn) {
            if (canalActif === nouveauCanal) return;
            sonClic();
            retirerAlerteEnveloppe(); // <--- AJOUT ICI
            canalActif = nouveauCanal;
            
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            btn.classList.remove('alerte-onglet'); // <--- NOUVELLE LIGNE POUR ÉTEINDRE L'ONGLET !

            const selectDest = document.getElementById('select-destinataire');
            const inputField = document.getElementById('comms-input');

            if (nouveauCanal === 'PRIVE') {
                selectDest.style.display = 'block';
                inputField.placeholder = "Saisissez votre message privé...";
                document.getElementById('badge-unread').style.display = 'none';
            } else {
                selectDest.style.display = 'none';
                inputField.placeholder = "Saisissez votre télégramme public...";
            }

            chargerHistorique();
        }

        function toggleUrgent() {
            sonClic();
            isUrgent = !isUrgent;
            const btn = document.getElementById('btn-urgent');
            if (isUrgent) btn.classList.add('active');
            else btn.classList.remove('active');
        }

        function updateCounter(e) {
            if (e.key !== 'Enter' && e.key !== 'Backspace') sonType();
            const input = document.getElementById('comms-input');
            document.getElementById('char-counter').innerText = `${input.value.length}/140`;
        }

        async function chargerListePilotes() {
            // CORRECTION CRUCIALE : On interroge 'profils_publics' car 'profils' est protégé par Supabase !
            const { data } = await supabaseApp.from('profils_publics').select('user_id, cmdr_nom, escadron_id');
            if (data) {
                listePilotes = data;
                const select = document.getElementById('select-destinataire');
                // On nettoie la liste au cas où on la recharge
                select.innerHTML = '<option value="">-- SÉLECTIONNEZ UN DESTINATAIRE --</option>';
                
                data.forEach(p => {
                    if (p.user_id !== profilCommandant.user_id && p.cmdr_nom) {
                        const opt = document.createElement('option');
                        opt.value = p.user_id;
                        opt.innerText = `CMDR ${p.cmdr_nom.toUpperCase()}`;
                        select.appendChild(opt);
                    }
                });
            }
        }

        // TÉLÉCHARGEMENT SÉCURISÉ DES ARCHIVES (PROJECTION STRICTE ANTI-EGRESS)
        async function chargerRenseignementLocal() {
            if (!profilCommandant || !profilCommandant.escadron_id) return;
            try {
                const [resTactique, resDiplo] = await Promise.all([
                    supabaseApp.from('registre_tactique').select('cmdr_cible, niveau_menace, rapport').eq('escadron_id', profilCommandant.escadron_id).eq('est_valide', true),
                    supabaseApp.from('traites_diplomatiques').select('tag, faction_cible, type_relation').eq('escadron_id', profilCommandant.escadron_id)
                ]);
                if (resTactique.data) cacheRegistreTactique = resTactique.data;
                if (resDiplo.data) cacheTraitesDiplo = resDiplo.data;
            } catch(e) { console.error("Erreur chargement renseignement:", e); }
        }

        async function chargerHistorique() {
            const feed = document.getElementById('message-feed');
            feed.innerHTML = '<div style="color: var(--ed-blue); text-align: center; margin-top: 40px;">> DECRYPTAGE EN COURS...</div>';
            
            try {
                let query = supabaseApp.from('transmissions').select('*').order('created_at', { ascending: true }).limit(50);
                
                // FILTRE DE PURGE : Seuls les messages émis depuis le dernier Tick sont chargés
                if (dernierTick && dernierTick.getTime() > 0) {
                    query = query.gte('created_at', dernierTick.toISOString());
                }

                if (canalActif === 'GLOBAL') {
                    query = query.eq('canal', 'GLOBAL');
                } else if (canalActif === 'ESCADRON') {
                    query = query.eq('canal', 'ESCADRON').eq('escadron_id', profilCommandant.escadron_id);
                } else if (canalActif === 'PRIVE') {
                    query = query.eq('canal', 'PRIVE').or(`destinataire_id.eq.${profilCommandant.user_id},expediteur_id.eq.${profilCommandant.user_id}`);
                }

                const { data, error } = await query;
                if (error) throw error;

                feed.innerHTML = '';
                if (data.length === 0) {
                    feed.innerHTML = '<div style="color: #555; text-align: center; margin-top: 40px;">> AUCUN SIGNAL DÉTECTÉ SUR CETTE FRÉQUENCE.</div>';
                } else {
                    data.forEach(msg => afficherMessage(msg, false));
                   if (canalActif === 'PRIVE') {
                        const unreadIds = data.filter(m => m.destinataire_id === profilCommandant.user_id && !m.lu).map(m => m.id);
                        if (unreadIds.length > 0) {
                            supabaseApp.from('transmissions').update({ lu: true }).in('id', unreadIds).then();
                        }
                    }
                }
                feed.scrollTop = feed.scrollHeight;
                
                // ON MET À JOUR LE CHRONOMÈTRE GLOBAL ET CELUI DE L'ONGLET ACTIF
                localStorage.setItem('edteam_last_msg_time', Date.now().toString());
                localStorage.setItem('edteam_last_read_' + canalActif, Date.now().toString());
                
            } catch (e) {
                feed.innerHTML = '<div style="color: red; text-align: center; margin-top: 40px;">> ERREUR DE SYNCHRONISATION.</div>';
            }
        }

        async function verifierOngletsNonLus() {
            if (!profilCommandant) return;
            
            // 1. Privé
            const { count } = await supabaseApp.from('transmissions').select('id', { count: 'exact', head: true }).eq('destinataire_id', profilCommandant.user_id).eq('lu', false);
            if (count > 0 && canalActif !== 'PRIVE') {
                const btn = document.getElementById('btn-tab-prive');
                if (btn) btn.classList.add('alerte-onglet');
                document.getElementById('badge-unread').style.display = 'inline';
            }

            // 2. Fonction pour vérifier les canaux publics
            const verifierCanal = async (canal, filtreCol, filtreVal, idBtn) => {
                const btn = document.getElementById(idBtn);
                if (!btn || btn.style.display === 'none' || canalActif === canal) return;

                const lastRead = parseInt(localStorage.getItem('edteam_last_read_' + canal) || '0');
                let query = supabaseApp.from('transmissions').select('created_at').eq('canal', canal).order('created_at', { ascending: false }).limit(1);
                if (filtreCol) query = query.eq(filtreCol, filtreVal);

                // ---> AJOUT : On ignore les messages fantômes (avant le tick) <---
                if (typeof dernierTick !== 'undefined' && dernierTick.getTime() > 0) {
                    query = query.gte('created_at', dernierTick.toISOString());
                }

                const { data } = await query;
                // S'il y a un message plus récent que notre dernière visite, ça clignote !
                if (data && data.length > 0 && new Date(data[0].created_at).getTime() > lastRead) {
                    btn.classList.add('alerte-onglet');
                }
            };

            await verifierCanal('GLOBAL', null, null, 'btn-tab-global');
            if (profilCommandant.escadron_id) await verifierCanal('ESCADRON', 'escadron_id', profilCommandant.escadron_id, 'btn-tab-escadron');
        }

        function afficherMessage(msg, animate = true) {
            const feed = document.getElementById('message-feed');
            
            if (feed.innerHTML.includes('DECRYPTAGE') || feed.innerHTML.includes('AUCUN SIGNAL')) {
                feed.innerHTML = '';
            }

            const d = new Date(msg.created_at);
            const timeStr = `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}:${d.getSeconds().toString().padStart(2, '0')}`;
            
            let auteurColor = (msg.expediteur_id === profilCommandant.user_id) ? 'var(--ed-blue)' : '#fff';
            let canalTag = "";
            let deleteBtn = "";

            if (msg.canal === 'GLOBAL') canalTag = `<span style="color:#888;">[GLOBAL] :</span>`;
            else if (msg.canal === 'ESCADRON') canalTag = `<span style="color:var(--ed-orange);">[ESCADRON] :</span>`;
            else if (msg.canal === 'COALITION') canalTag = `<span style="color:#B026FF; font-weight:bold;">[${msg.escadron_id || 'ALLIÉ'}] :</span>`;
            else if (msg.canal === 'PRIVE') {
                if (msg.expediteur_id === profilCommandant.user_id) {
                    const nomDest = listePilotes.find(p => p.user_id === msg.destinataire_id)?.cmdr_nom || 'INCONNU';
                    canalTag = `<span style="color:var(--ed-green);">[À: ${nomDest.toUpperCase()}] :</span>`;
                } else {
                    canalTag = `<span style="color:var(--ed-green);">[PRIVÉ] :</span>`;
                }
                deleteBtn = `<span class="msg-delete" onclick="supprimerMessage('${msg.id}', this)" title="Effacer l'archive">[x]</span>`;
            }

            // =========================================
            // FILTRE À RAYONS X : ANALYSE TACTIQUE DE L'EXPÉDITEUR
            // =========================================
            let tagsRenseignement = "";
            
            if (profilCommandant.escadron_id) {
                const nomExpediteur = msg.expediteur_nom ? msg.expediteur_nom.toUpperCase() : "";
                // Registre JS pour le contenu des tooltips (indexe par id de message, evite le
                // piege du double-decodage HTML qu'un simple escapeHtml() ne survivrait pas
                // si le texte etait serialise directement dans l'attribut onmouseenter).
                window.__tagTooltip = window.__tagTooltip || {};

                // 1. Recherche dans le Registre Tactique (Individuel)
                const fiche = cacheRegistreTactique.find(f => f.cmdr_cible.toUpperCase() === nomExpediteur);
                if (fiche) {
                    const txtRapport = escapeHtml(fiche.rapport || 'Aucun rapport').replace(/\r?\n/g, '<br>');
                    if (fiche.niveau_menace === 'KOS') {
                        window.__tagTooltip[msg.id + '_kos'] = `> CIBLE K.O.S<br><span style="color:#fff; font-weight:normal;">${txtRapport}</span>`;
                        // AJOUT DE L'ANIMATION DE CLIGNOTEMENT (alertPulse)
                        tagsRenseignement += `<span style="background: rgba(255,51,51,0.15); color: #FF3333; border: 1px solid #FF3333; padding: 2px 6px; border-radius: 3px; font-size: 0.8em; font-weight: bold; margin-right: 8px; cursor: help; animation: alertPulse 1.2s infinite;" onmouseenter="showHoloTooltip(event, window.__tagTooltip['${msg.id}_kos'], '#FF3333')" onmouseleave="hideHoloTooltip()" onmousemove="moveHoloTooltip(event)">[🔴 K.O.S]</span>`;
                    } else if (fiche.niveau_menace === 'SUSPECT') {
                        window.__tagTooltip[msg.id + '_suspect'] = `> INDIVIDU SUSPECT<br><span style="color:#fff; font-weight:normal;">${txtRapport}</span>`;
                        tagsRenseignement += `<span style="background: rgba(255,113,0,0.15); color: var(--ed-orange); border: 1px solid var(--ed-orange); padding: 2px 6px; border-radius: 3px; font-size: 0.8em; font-weight: bold; margin-right: 8px; cursor: help;" onmouseenter="showHoloTooltip(event, window.__tagTooltip['${msg.id}_suspect'], 'var(--ed-orange)')" onmouseleave="hideHoloTooltip()" onmousemove="moveHoloTooltip(event)">[🟠 SUSPECT]</span>`;
                    } else if (fiche.niveau_menace === 'ALLIE') {
                        window.__tagTooltip[msg.id + '_allie_reg'] = `> ALLIÉ V.I.P<br><span style="color:#fff; font-weight:normal;">${txtRapport}</span>`;
                        tagsRenseignement += `<span style="background: rgba(0,255,102,0.15); color: #00FF66; border: 1px solid #00FF66; padding: 2px 6px; border-radius: 3px; font-size: 0.8em; font-weight: bold; margin-right: 8px; cursor: help;" onmouseenter="showHoloTooltip(event, window.__tagTooltip['${msg.id}_allie_reg'], '#00FF66')" onmouseleave="hideHoloTooltip()" onmousemove="moveHoloTooltip(event)">[🟢 V.I.P]</span>`;
                    }
                }

                // 2. Recherche Diplomatique (Croisement Tag et Nom)
                const profilExpediteur = listePilotes.find(p => p.user_id === msg.expediteur_id);
                if (profilExpediteur && profilExpediteur.escadron_id) {

                    const traite = cacheTraitesDiplo.find(t =>
                        (t.tag && t.tag.toUpperCase() === profilExpediteur.escadron_id.toUpperCase()) ||
                        (t.faction_cible && t.faction_cible.toUpperCase() === profilExpediteur.escadron_id.toUpperCase())
                    );

                    if (traite) {
                        const tagAffiche = escapeHtml(traite.tag ? traite.tag.toUpperCase() : traite.faction_cible.substring(0, 4).toUpperCase());
                        const facName = escapeHtml(traite.faction_cible || 'INCONNUE');

                        if (traite.type_relation === 'HOSTILE') {
                            window.__tagTooltip[msg.id + '_hostile'] = `> TRAITÉ HOSTILE<br><span style="color:#fff; font-weight:normal;">${facName}</span>`;
                            // AJOUT DE L'ANIMATION DE CLIGNOTEMENT (alertPulse)
                            tagsRenseignement += `<span style="background: rgba(255,51,51,0.15); color: #FF3333; border: 1px dashed #FF3333; padding: 2px 6px; border-radius: 3px; font-size: 0.8em; font-weight: bold; margin-right: 8px; cursor: help; animation: alertPulse 1.2s infinite;" onmouseenter="showHoloTooltip(event, window.__tagTooltip['${msg.id}_hostile'], '#FF3333')" onmouseleave="hideHoloTooltip()" onmousemove="moveHoloTooltip(event)">[⚔️ ${tagAffiche}]</span>`;
                        } else if (traite.type_relation === 'PNA') {
                            window.__tagTooltip[msg.id + '_pna'] = `> P.N.A (NON-AGRESSION)<br><span style="color:#fff; font-weight:normal;">${facName}</span>`;
                            tagsRenseignement += `<span style="background: rgba(0,240,255,0.15); color: var(--ed-blue); border: 1px dashed var(--ed-blue); padding: 2px 6px; border-radius: 3px; font-size: 0.8em; font-weight: bold; margin-right: 8px; cursor: help;" onmouseenter="showHoloTooltip(event, window.__tagTooltip['${msg.id}_pna'], 'var(--ed-blue)')" onmouseleave="hideHoloTooltip()" onmousemove="moveHoloTooltip(event)">[🛡️ ${tagAffiche}]</span>`;
                        } else if (traite.type_relation === 'ALLIE') {
                            window.__tagTooltip[msg.id + '_allie_traite'] = `> ALLIÉ (COALITION)<br><span style="color:#fff; font-weight:normal;">${facName}</span>`;
                            tagsRenseignement += `<span style="background: rgba(0,255,102,0.15); color: #00FF66; border: 1px dashed #00FF66; padding: 2px 6px; border-radius: 3px; font-size: 0.8em; font-weight: bold; margin-right: 8px; cursor: help;" onmouseenter="showHoloTooltip(event, window.__tagTooltip['${msg.id}_allie_traite'], '#00FF66')" onmouseleave="hideHoloTooltip()" onmousemove="moveHoloTooltip(event)">[🤝 ${tagAffiche}]</span>`;
                        }
                    }
                }
            }
            // =========================================

            const urgentClass = msg.est_urgent ? 'urgent' : '';
            const urgentTag = msg.est_urgent ? '<span style="color:var(--ed-red); font-weight:bold; margin-right:5px;">[!]</span>' : '';

            const msgDiv = document.createElement('div');
            msgDiv.className = `msg-line ${urgentClass}`;
            
            // NOUVEAU : On force l'alignement en haut et on empêche le bloc de se casser
            msgDiv.style.flexWrap = 'nowrap';
            msgDiv.style.alignItems = 'flex-start';
            
            if (!animate) msgDiv.style.animation = 'none';
            
            msgDiv.innerHTML = `
                <!-- COLONNE GAUCHE : L'en-tête -->
                <div style="flex-shrink: 0; margin-right: 8px; display: flex; align-items: baseline; flex-wrap: wrap;">
                    <span class="msg-time">[${timeStr}]</span>
                    ${tagsRenseignement}
                    <span class="msg-author" style="color: ${auteurColor};">CMDR ${escapeHtml(msg.expediteur_nom)} ></span>
                    <span class="msg-channel">${canalTag}</span>
                </div>

                <!-- COLONNE DROITE : Le message -->
                <div class="msg-text" style="flex-grow: 1; word-break: break-word;">
                    ${urgentTag}${escapeHtml(msg.message)}
                </div>
                
                ${deleteBtn}
            `;
            
            feed.appendChild(msgDiv);
            feed.scrollTop = feed.scrollHeight;
        }

        async function transmettreMessage() {
            const input = document.getElementById('comms-input');
            const texte = input.value.trim();
            const destId = document.getElementById('select-destinataire').value;
            const btn = document.getElementById('btn-send');

            if (!texte) return;
            if (canalActif === 'PRIVE' && !destId) {
                alert("Sélectionnez un destinataire."); return;
            }

            sonClic();
            btn.disabled = true;
            btn.innerText = "ENVOI...";
            input.value = ''; // On vide immédiatement le champ
            document.getElementById('char-counter').innerText = `0/140`;

            const payload = {
                expediteur_id: profilCommandant.user_id,
                expediteur_nom: profilCommandant.cmdr_nom || 'INCONNU',
                canal: canalActif,
                message: texte,
                est_urgent: isUrgent
            };

            if (canalActif === 'ESCADRON') payload.escadron_id = profilCommandant.escadron_id;
            if (canalActif === 'PRIVE') payload.destinataire_id = destId;

            try {
                const { error } = await supabaseApp.from('transmissions').insert([payload]);
                if (error) throw error;
                
                // NOUVEAU : Enregistrement direct dans le journal tactique (Canaux publics uniquement)
                if (canalActif === 'GLOBAL' || canalActif === 'ESCADRON') {
                    supabaseApp.from('journal_activite').insert([{
                        escadron_id: profilCommandant.escadron_id,
                        user_id: profilCommandant.user_id,
                        cmdr_nom: profilCommandant.cmdr_nom || 'INCONNU',
                        type_action: 'TRANSMISSION',
                        details: 'Nouveau message sur les fréquences de communication.',
                        couleur: 'var(--ed-blue)'
                    }]).then();
                }

                if (isUrgent) toggleUrgent();
            } catch (e) {
                console.error(e);
                alert("Échec de la transmission.");
            }
            
            btn.disabled = false;
            btn.innerText = "TRANSMETTRE";
            input.focus();
        }

        async function supprimerMessage(id, btnElement) {
            sonClic();
            try {
                const { error } = await supabaseApp.from('transmissions').delete().eq('id', id);
                if (error) throw error;
                btnElement.parentElement.style.display = 'none';
            } catch(e) { console.error("Erreur suppression:", e); }
        }

        // --- ECOUTE TEMPS RÉEL SUR CETTE PAGE ---
        function ecouterTransmissions() {
            supabaseApp.channel('page:transmissions')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'transmissions' }, payload => {
                    const msg = payload.new;
                    
                    let afficherDirectement = false;
                    if (canalActif === 'GLOBAL' && msg.canal === 'GLOBAL') afficherDirectement = true;
                    if (canalActif === 'ESCADRON' && msg.canal === 'ESCADRON' && msg.escadron_id === profilCommandant.escadron_id) afficherDirectement = true;
                    if (canalActif === 'PRIVE' && msg.canal === 'PRIVE' && (msg.destinataire_id === profilCommandant.user_id || msg.expediteur_id === profilCommandant.user_id)) afficherDirectement = true;

                    if (afficherDirectement) {
                        playUI('receive');
                        afficherMessage(msg, true);
                        
                        if (canalActif === 'PRIVE' && msg.destinataire_id === profilCommandant.user_id) {
                            supabaseApp.from('transmissions').update({ lu: true }).eq('id', msg.id).then();
                        }
                    } else {
                        // Le message n'est pas pour l'onglet actif : on fait clignoter l'onglet concerné !
                        let idOnglet = null;
                        if (msg.canal === 'GLOBAL') idOnglet = 'btn-tab-global';
                        else if (msg.canal === 'ESCADRON' && msg.escadron_id === profilCommandant.escadron_id) idOnglet = 'btn-tab-escadron';
                        else if (msg.canal === 'PRIVE' && msg.destinataire_id === profilCommandant.user_id) {
                            idOnglet = 'btn-tab-prive';
                            document.getElementById('badge-unread').style.display = 'inline';
                        }

                        if (idOnglet) {
                            const btnOnglet = document.getElementById(idOnglet);
                            if (btnOnglet) btnOnglet.classList.add('alerte-onglet');
                            playUI('receive');
                        }
                    }
                })
                .subscribe();
        }

    </script>

        Application de fan - edteam.portal 2026
    </div>

    <script>

        // --- SON DE VALIDATION D'EFFORT BGS ---
        function sonBgsUpdate() {
            if (!audioCtx) initAudio();
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, t);
            osc.frequency.exponentialRampToValueAtTime(600, t + 0.4);
            
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.1, t + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 1);
            
            const delay = audioCtx.createDelay();
            delay.delayTime.value = 0.25;
            const feedback = audioCtx.createGain();
            feedback.gain.value = 0.3;
            delay.connect(feedback); 
            feedback.connect(delay);
            
            osc.connect(gain); 
            gain.connect(audioCtx.destination);
            gain.connect(delay);
            delay.connect(audioCtx.destination);
            
            osc.start(t); 
            osc.stop(t + 1);
        }

        // --- ÉCOUTEUR DES EFFORTS (FILTRÉ CÔTÉ SERVEUR POUR L'EGRESS) ---
        function ecouterEffortsBGS() {
            if (!profilCommandant) return;
            supabaseApp.channel('live_efforts_bgs_global')
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'efforts_bgs',
                    filter: `user_id=eq.${profilCommandant.user_id}` 
                }, payload => {
                    sonBgsUpdate();
                })
                .subscribe();
        }

    </script>
