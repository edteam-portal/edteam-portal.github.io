<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <title>EDTEAM // TABLEAU DE BORD</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="shared-utils.js?v=3"></script>
    <script src="son.js?v=1"></script>
    <script src="photos.js?v=2"></script>
    <script src="navigation.js?v=30"></script>

    <style>
        :root { --ed-orange: #FF7100; --ed-orange-dim: rgba(255, 113, 0, 0.2); --ed-orange-glow: rgba(255, 113, 0, 0.5); --ed-blue: #00F0FF; --ed-bg: #020100; --ed-red: #FF3333; --ed-green: #00FF66; }
        body { margin: 0; padding: 0; background-color: var(--ed-bg); background-image: radial-gradient(circle at center, #0a0500 0%, #000 100%); color: var(--ed-orange); font-family: 'Share Tech Mono', monospace; overflow: hidden; height: 100vh; display: flex; align-items: flex-start; justify-content: center; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.6); border-left: 1px solid rgba(255, 113, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: var(--ed-orange); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #fff; box-shadow: 0 0 10px var(--ed-orange); }

        /* =========================================
           BALAYAGE HOLOGRAPHIQUE (SCANLINE)
           ========================================= */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--ed-orange);
            box-shadow: 0 0 15px var(--ed-orange-glow), 0 0 5px var(--ed-orange);
            opacity: 0.15;
            z-index: 9999;
            pointer-events: none;
            animation: scanline-anim 8s linear infinite;
        }

        @keyframes scanline-anim {
            0% { transform: translateY(-10px); }
            100% { transform: translateY(100vh); }
        }


        /* =========================================
           MENU LATÉRAL TACTIQUE
           ========================================= */
        #side-menu {
            position: fixed; top: 0; left: 0; height: 100vh; width: 60px;
            background: rgba(10, 10, 10, 0.95); border-right: 1px solid var(--ed-orange-dim);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden; z-index: 2000; display: flex; flex-direction: column; padding-top: 15px;
        }
        #side-menu.open { width: 250px; box-shadow: 5px 0 30px rgba(0,0,0,0.9); border-right: 1px solid var(--ed-orange); }
        
        .nav-link { display: flex; align-items: center; padding: 15px; color: #888; text-decoration: none; white-space: nowrap; transition: 0.2s; border-left: 3px solid transparent; cursor: pointer; }
        .nav-link:hover { color: var(--ed-orange); background: rgba(255, 113, 0, 0.1); border-left: 3px solid var(--ed-orange); }
        .nav-link.active { color: var(--ed-blue); background: rgba(0, 240, 255, 0.05); border-left: 3px solid var(--ed-blue); }
        
        .nav-icon { min-width: 30px; display: flex; justify-content: center; align-items: center; }
        .nav-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-text { margin-left: 15px; font-weight: bold; letter-spacing: 2px; opacity: 0; transition: opacity 0.2s; font-size: 0.9em; }
        #side-menu.open .nav-text { opacity: 1; transition-delay: 0.1s; }
        .hamburger-btn { margin-bottom: 20px; border-bottom: 1px solid #333; color: var(--ed-orange); }

        /* =========================================
           CONTENEUR CENTRAL DYNAMIQUE
           ========================================= */
        .hud-container { 
            width: calc(100% - 60px); max-width: 1920px; height: 95vh; display: flex; flex-direction: column; 
            margin-left: 60px; padding: 20px 30px; box-sizing: border-box;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.menu-open .hud-container { margin-left: 250px; width: calc(100% - 250px); }

        .hud-header { display: flex; flex-direction: column; margin-bottom: 15px; flex-shrink: 0; }
        .app-logo { height: 45px; width: 45px; filter: drop-shadow(0 0 5px var(--ed-orange-glow)); transition: 0.3s; }
        
        /* STYLE DU HEADER UNIFIÉ */
        #fc-inventory-percent { font-size: 0.9em; color: #fff; letter-spacing: 2px; font-weight: bold; background: rgba(0, 240, 255, 0.08); padding: 4px 15px; border-radius: 4px; border: 1px solid rgba(0, 240, 255, 0.4); display: flex; align-items: center; gap: 10px; white-space: nowrap; }
        .info-btn { cursor: pointer; font-weight: bold; transition: 0.2s; display: inline-block; padding: 0 4px; }
        .info-btn:hover { color: #fff !important; text-shadow: 0 0 8px currentColor; transform: scale(1.1); }
        
        .header-bottom-row { display: flex; align-items: center; gap: 15px; border-bottom: 2px solid var(--ed-orange); padding-bottom: 10px; margin-bottom: 15px; }
        .tab-bar { display: flex; gap: 5px; flex-wrap: wrap; }
        .tab-btn { background: transparent; border: 1px solid var(--ed-orange-dim); border-bottom: none; color: var(--ed-orange); padding: 8px 30px; font-family: 'Share Tech Mono', monospace; font-size: 1.05em; letter-spacing: 2px; cursor: pointer; opacity: 0.5; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); transition: 0.2s; }
        .tab-btn:hover { background: rgba(255, 113, 0, 0.1); opacity: 0.8; }
        .tab-btn.active { opacity: 1; background: var(--ed-orange); color: #000; font-weight: bold; }

        .data-window { flex-grow: 1; overflow-y: auto; padding-right: 10px; }
        .data-row { border: 1px solid rgba(255, 113, 0, 0.2); border-radius: 4px; background: rgba(10, 5, 0, 0.6); padding: 20px; margin-bottom: 15px; }
        
        /* CARD PILOTE (Membres de l'escadron) */
        .pilot-card { background: rgba(10, 5, 0, 0.6); border: 1px solid var(--ed-orange-dim); border-radius: 4px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .pilot-card:hover { background: rgba(255, 113, 0, 0.1); border-color: var(--ed-orange); box-shadow: 0 0 10px rgba(255, 113, 0, 0.2); }

        .rank-row { display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid rgba(255,113,0,0.1); transition: 0.2s; }
        .rank-row:hover { background: rgba(255,113,0,0.05); }
        .rank-1 { color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,0.5); font-size: 1.2em; font-weight: bold; }
        .rank-2 { color: #C0C0C0; font-size: 1.1em; font-weight: bold; }
        .rank-3 { color: #CD7F32; font-size: 1.1em; font-weight: bold; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes alertPulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        #holo-tooltip { position: fixed; display: none; background: rgba(10, 5, 0, 0.95); border: 1px solid var(--ed-orange); color: #fff; padding: 6px 12px; font-size: 0.85em; z-index: 10000; pointer-events: none; border-radius: 3px; font-weight: bold; letter-spacing: 1px; white-space: nowrap;}

        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 2000;
            padding: 40px; /* Force une belle marge noire tout autour de la modale */
            box-sizing: border-box;
        }
        
        .modal-content { 
            background: rgba(10, 5, 0, 0.95); border: 1px solid var(--ed-orange); padding: 30px; 
            max-width: 600px; width: 100%; color: #ccc; position: relative; 
            max-height: 100%; /* S'arrête exactement avant la marge de l'overlay */
            overflow-y: auto; box-sizing: border-box;
        }

        /* Optimisation automatique pour les écrans 14" (Petite hauteur) */
        @media (max-width: 1400px), (max-height: 800px) {
            .modal-overlay { padding: 15px; } /* Marge réduite pour gagner de l'espace */
            .modal-content { padding: 20px; } /* On réduit un peu l'espace vide à l'intérieur */
        }

        /* Fiche pilote : les colonnes se replient sur un écran étroit */
        @media (max-width: 800px) {
            #grille-fiche-pilote, #bandeau-fiche-pilote { grid-template-columns: 1fr !important; }
        }

        /* Correction spécifique pour la barre de scroll des modales PC */
        .modal-content::-webkit-scrollbar { width: 8px; }
        .modal-content::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.4); border-left: 1px solid rgba(255, 113, 0, 0.1); }
        .modal-content::-webkit-scrollbar-thumb { background: var(--ed-orange); border-radius: 4px; }
        .modal-close { position: absolute; top: 15px; right: 20px; color: var(--ed-orange); cursor: pointer; font-size: 1.2em; font-weight: bold; }

        .copy-click { cursor: pointer; transition: all 0.2s; padding: 2px 5px; border-radius: 3px; }

        /* ===== TABLEAU DE BORD EN JEU : cadre = classe .bloc du site (bloc.css) ; tout le reste est propre a cette page ===== */
        .tb-top { display:flex; justify-content:space-between; align-items:center; gap:10px 18px; flex-wrap:wrap; margin-bottom:12px; }
        .tb-cmdr { font-size:1.15em; letter-spacing:3px; color:var(--ed-orange); }
        .tb-cmdr small { color:#888; letter-spacing:1px; margin-left:10px; font-size:.7em; }
        .tb-live { display:inline-flex; align-items:center; gap:8px; font-size:.85em; letter-spacing:1px; color:#00FF66; }
        .tb-live i { width:9px; height:9px; border-radius:50%; background:#00FF66; box-shadow:0 0 8px #00FF66; animation:alertPulse 1.6s infinite; }
        .tb-live.off { color:#888; } .tb-live.off i { background:#666; box-shadow:none; animation:none; }
        .tb-live.old { color:#e8a35a; } .tb-live.old i { background:#e8a35a; box-shadow:0 0 8px #e8a35a; }
        .tb-tabs { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:14px; border-bottom:2px solid var(--ed-orange); }
        .tb-tab { background:transparent; border:1px solid rgba(255,113,0,.22); border-bottom:none; color:var(--ed-orange); padding:9px 24px; font:inherit; letter-spacing:2px; cursor:pointer; opacity:.7; }
        .tb-tab:hover { opacity:.95; background:rgba(255,113,0,.1); }
        .tb-tab.on { opacity:1; background:var(--ed-orange); color:#000; font-weight:bold; }
        .tb-tab.off { opacity:.35; border-style:dashed; cursor:not-allowed; }
        .tb-banner { border:1px solid rgba(232,163,90,.55); background:rgba(232,163,90,.08); color:#e8a35a; padding:9px 14px; margin-bottom:12px; font-size:.9em; line-height:1.5; }
        .tb-grid4 { display:grid; grid-template-columns:1.6fr repeat(3,1fr); gap:12px; margin-bottom:12px; }
        .tb-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
        @media (max-width:1100px) { .tb-grid4 { grid-template-columns:1fr 1fr; } .tb-grid2 { grid-template-columns:1fr; } }
        .tb-big { font-size:1.9em; color:#fff; text-shadow:0 0 14px currentColor; line-height:1.1; white-space:nowrap; }
        .tb-up { color:#00FF66; } .tb-down { color:#FF3333; } .tb-cy { color:#00F0FF; } .tb-gold { color:#FFD700; } .tb-mut { color:#777; }
        .tb-sub { font-size:.85em; color:#8a9; margin-top:6px; letter-spacing:1px; }
        .tb-jauge { height:9px; background:rgba(255,255,255,.07); position:relative; margin:9px 0 5px; }
        .tb-jauge i { position:absolute; left:0; top:0; bottom:0; background:#00FF66; box-shadow:0 0 8px #00FF66; }
        /* soute holographique : le cadre est ENTIEREMENT rempli de caisses (capacite du vaisseau), sans ecart entre les cases (sinon la survol clignote) */
        .tb-grille { display:grid; gap:0; margin-top:6px; }
        .tb-cr { aspect-ratio:1; position:relative; }
        .tb-cr:after { content:""; position:absolute; inset:1.5px; border:1px dashed rgba(0,240,255,.22); background:rgba(0,240,255,.03); }
        .tb-cr.f { cursor:pointer; }
        .tb-cr.f:after { border:1px solid var(--cl); background:color-mix(in srgb,var(--cl) 24%,transparent); box-shadow:0 0 6px color-mix(in srgb,var(--cl) 45%,transparent); }
        .tb-cr.f.m:after { border-style:dashed; }
        .tb-cr.f:before { content:""; position:absolute; left:14%; right:14%; top:50%; height:1px; background:var(--cl); opacity:.65; z-index:1; }
        .tb-cr.f.hl:after { background:color-mix(in srgb,var(--cl) 55%,transparent); box-shadow:0 0 12px var(--cl); }
        .tb-cr.f.hl { z-index:2; }
        .tb-grille.dim .tb-cr.f:not(.hl):after { opacity:.3; }
        .tb-leg { display:flex; gap:6px 16px; flex-wrap:wrap; font-size:.9em; margin-top:10px; color:#b8c2c8; }
        .tb-leg span { cursor:pointer; } .tb-leg i { display:inline-block; width:10px; height:10px; background:var(--cl); margin-right:6px; }
        .tb-cap { display:flex; justify-content:space-between; font-size:.85em; color:#8a9; margin-top:8px; gap:8px; flex-wrap:wrap; }
        #tb-tip { position:fixed; z-index:3000; pointer-events:none; background:#000; border:1px solid #00F0FF; padding:6px 10px; font-size:.85em; display:none; line-height:1.5; color:#ddd; }
        #tb-tip b { color:#FFD700; font-weight:normal; }
        .tb-table { width:100%; border-collapse:collapse; font-size:.92em; }
        .tb-table th { color:#777; font-weight:normal; letter-spacing:1px; font-size:.8em; text-align:left; padding:6px 8px; border-bottom:1px solid #2a2a2a; }
        .tb-table td { padding:7px 8px; border-bottom:1px solid #161616; }
        .tb-table .r { text-align:right; } .tb-ach { color:#00F0FF; } .tb-ven { color:#00FF66; }
        .tb-vide { color:#777; text-align:center; padding:26px 10px; border:1px dashed #333; line-height:1.7; }
        .tb-bientot { opacity:.55; }
        /* missions */
        .tb-ms { display:grid; grid-template-columns:44px 1fr auto; gap:12px; align-items:center; border:1px solid #2c3338; border-left:4px solid var(--cl2,#00FF66); background:rgba(0,0,0,.4); padding:10px 12px; margin-bottom:10px; }
        .tb-ms.ko { --cl2:#FF3333; } .tb-ms.wa { --cl2:#FFD700; } .tb-ms.ok { --cl2:#00FF66; }
        .tb-ms .ic { font-size:1.6em; text-align:center; } .tb-ms .ti { color:#fff; } .tb-ms .sb { color:#8a9; font-size:.85em; margin-top:2px; overflow-wrap:anywhere; }
        .tb-ms .lx { color:#00F0FF; }
        .tb-ms .mt { display:flex; gap:6px 10px; flex-wrap:wrap; margin-top:6px; font-size:.8em; color:#b8c2c8; }
        .tb-ms .mt span { border:1px solid #2c3338; padding:1px 8px; background:rgba(255,255,255,.03); }
        .tb-cd { text-align:center; min-width:62px; } .tb-cd b { display:block; font-weight:normal; font-size:.85em; color:#fff; margin-top:2px; }
        .tb-gps { position:relative; padding-left:20px; }
        .tb-gps:before { content:""; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background:repeating-linear-gradient(180deg,#00F0FF 0 6px,transparent 6px 10px); }
        .tb-st { position:relative; padding:6px 0 12px; }
        .tb-st:before { content:""; position:absolute; left:-20px; top:11px; width:12px; height:12px; border-radius:50%; border:2px solid #00F0FF; background:#000; }
        .tb-st.fin:before { border-color:#00FF66; background:#00FF66; } .tb-st.dep:before { border-color:#8b97a0; }
        .tb-st b { color:#00F0FF; font-weight:normal; } .tb-st span { display:block; color:#8a9; font-size:.85em; margin-top:2px; line-height:1.5; }
        .tb-rp { display:grid; grid-template-columns:minmax(110px,1.2fr) 2fr 36px minmax(80px,1fr); gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid #161616; font-size:.92em; }
        .tb-rp .rb { height:7px; background:rgba(255,255,255,.07); } .tb-rp .rb i { display:block; height:100%; background:#00FF66; box-shadow:0 0 6px #00FF66; }
        .tb-rp em { font-style:normal; color:#777; font-size:.85em; }
        .tb-carte { width:100%; height:auto; display:block; }
        /* feuille de route */
        .tb-barre { display:flex; gap:14px 24px; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; margin-bottom:14px; padding-bottom:14px; border-bottom:1px dashed #2f353a; }
        .tb-regl { display:flex; gap:14px 28px; flex-wrap:wrap; }
        .tb-regl .g { display:flex; flex-direction:column; gap:5px; }
        .tb-regl label { font-size:.72em; letter-spacing:2px; color:#8a9; }
        .tb-regl small { font-size:.72em; color:#667; }
        .tb-seg { display:inline-flex; border:1px solid #444; align-self:flex-start; }
        .tb-seg button { background:transparent; border:0; border-right:1px solid #333; color:#999; font:inherit; font-size:.95em; padding:6px 13px; cursor:pointer; }
        .tb-seg button:last-child { border:0; } .tb-seg button.on { background:rgba(0,240,255,.15); color:#00F0FF; box-shadow:inset 0 0 8px rgba(0,240,255,.25); }
        .tb-tg { display:inline-flex; align-items:center; gap:8px; cursor:pointer; background:none; border:1px solid #444; color:#999; font:inherit; font-size:.9em; letter-spacing:1px; padding:6px 12px; align-self:flex-start; }
        .tb-tg i { width:26px; height:14px; border-radius:8px; background:#333; position:relative; display:inline-block; }
        .tb-tg i:after { content:""; position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:#888; transition:.15s; }
        .tb-tg.on { color:#00FF66; border-color:rgba(0,255,102,.5); } .tb-tg.on i { background:rgba(0,255,102,.35); } .tb-tg.on i:after { left:14px; background:#00FF66; }
        .tb-btn { background:rgba(255,215,0,.1); border:1px solid #FFD700; color:#FFD700; font:inherit; letter-spacing:2px; font-size:.95em; padding:11px 22px; cursor:pointer; }
        .tb-btn:hover:not(:disabled) { background:#FFD700; color:#000; } .tb-btn:disabled { opacity:.4; cursor:not-allowed; }
        .tb-btn.vert { background:rgba(0,255,102,.1); border-color:#00FF66; color:#00FF66; } .tb-btn.vert:hover { background:#00FF66; color:#000; }
        .tb-invite { border:1px dashed #3a3a2a; padding:20px 22px; color:#aaa; line-height:1.6; }
        .tb-invite b { display:block; color:#fff; font-weight:normal; font-size:1.05em; margin-bottom:4px; } .tb-invite span { display:block; font-size:.9em; }
        .tb-attente { display:flex; align-items:center; gap:16px; padding:22px; border:1px solid rgba(255,215,0,.4); background:rgba(255,215,0,.05); }
        .tb-attente b { display:block; color:#FFD700; font-weight:normal; letter-spacing:1px; } .tb-attente span { color:#9a9; font-size:.85em; }
        .tb-spin { flex:0 0 auto; width:22px; height:22px; border:3px solid #FFD700; border-top-color:transparent; border-radius:50%; animation:tbTourne .9s linear infinite; }
        @keyframes tbTourne { to { transform:rotate(360deg); } }
        .tb-vx { color:#e8a35a; } .tb-ok { color:#8a9; }
        .tb-kpi { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:10px; }
        @media (max-width:1000px) { .tb-kpi { grid-template-columns:1fr 1fr; } }
        .tb-kpi .k { border:1px solid #2c3338; background:rgba(0,0,0,.4); padding:10px 14px; display:flex; flex-direction:column; gap:3px; }
        .tb-kpi .k span { font-size:.72em; letter-spacing:2px; color:#8a9; } .tb-kpi .k b { font-weight:normal; font-size:1.55em; color:#fff; } .tb-kpi .k small { font-size:.75em; color:#778; }
        .tb-prog { height:6px; background:rgba(255,255,255,.07); margin-bottom:16px; } .tb-prog i { display:block; height:100%; background:#00FF66; box-shadow:0 0 8px #00FF66; }
        /* la route : un arret par ligne, comme une feuille de route de chauffeur */
        .tb-route { display:flex; flex-direction:column; }
        .tb-arret { display:grid; grid-template-columns:54px 1fr; }
        .tb-arret .rail { position:relative; display:flex; justify-content:center; }
        .tb-arret .num { z-index:1; width:36px; height:36px; border-radius:50%; border:2px solid #556; background:#050607; color:#99a; display:grid; place-items:center; font-size:1em; margin-top:10px; }
        .tb-arret.fait .num { border-color:#00FF66; background:rgba(0,255,102,.18); color:#00FF66; }
        .tb-arret.cours .num { border-color:#FFD700; background:rgba(255,215,0,.2); color:#FFD700; box-shadow:0 0 14px rgba(255,215,0,.5); }
        .tb-arret .corps { border:1px solid #2c3338; background:rgba(0,0,0,.4); padding:12px 16px; min-width:0; }
        .tb-arret.fait .corps { border-color:rgba(0,255,102,.45); background:rgba(0,255,102,.04); }
        .tb-arret.cours .corps { border-color:#FFD700; background:rgba(255,215,0,.05); box-shadow:0 0 16px rgba(255,215,0,.15); }
        .tb-arret .tete { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
        .tb-arret .lieu { color:#fff; font-size:1.2em; font-weight:normal; letter-spacing:1px; margin-right:12px; } .tb-arret .sys { color:#00F0FF; font-size:.9em; }
        .tb-arret .etat { font-size:.75em; letter-spacing:2px; color:#778; } .tb-arret.fait .etat { color:#00FF66; } .tb-arret.cours .etat { color:#FFD700; }
        .tb-arret .cols { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        @media (max-width:900px) { .tb-arret .cols { grid-template-columns:1fr; } }

    <script>
        // ===== TABLEAU DE BORD EN JEU (script SQL 77 + plugin 2.9) : la session du pilote en direct, lue dans session_live (SA ligne seulement) =====
        // Lecture : une fois a l'ouverture (rpc live_lire), puis en TEMPS REEL sur sa ligne ; relecture de secours toutes les 60 s si le temps reel coupe.
        // Tout ce qui bouge a l'ecran (decomptes, duree de jeu) est calcule ICI, sans requete.
        const supabaseApp = window.supabaseApp;
        let profilCommandant = null, uid = null;
        let S = null;                 // etat de la session (champ etat de session_live) ; null = aucune session recue
        let MAJ = null;               // maj_le du serveur (ISO)
        let MODE = lire("edteam_tb_mode") === "mis" ? "mis" : "com";
        let canal = null, rtOk = false, derniereLecture = 0;

        function lire(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function ecrire(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sans stockage : le mode de depart sera le defaut */ } }
        const esc = escapeHtml;
        // tout nom de systeme ou de station est cliquable : un clic le copie (pour le coller dans la carte galactique ou la recherche du jeu)
        const cp = (nom, aff) => nom ? `<span class="tb-cp" data-copie="${esc(nom)}" title="Cliquer pour copier : ${esc(nom)}">${esc(aff == null ? nom : aff)}</span>` : "";
        function toastCopie(txt) {
            let t = document.getElementById("tb-toast");
            if (!t) { t = document.createElement("div"); t.id = "tb-toast"; document.body.appendChild(t); }
            t.textContent = "Copié : " + txt; t.classList.add("on"); clearTimeout(t._m); t._m = setTimeout(() => t.classList.remove("on"), 1600);
        }
        function copierNom(txt, el) {
            const fin = () => { toastCopie(txt); if (typeof sonClic === "function") sonClic(); if (el && el.classList) { el.classList.add("copie"); setTimeout(() => el.classList.remove("copie"), 900); } };
            const repli = () => { const t = document.createElement("textarea"); t.value = txt; t.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); fin(); } catch (e) { /* copie impossible */ } t.remove(); };
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(fin).catch(repli); else repli();
        }
        document.addEventListener("click", e => {
            const c = e.target && e.target.closest ? e.target.closest("[data-copie]") : null;
            if (!c) return;
            e.stopPropagation(); e.preventDefault();
            copierNom(c.getAttribute("data-copie"), c);
        }, true);
        const fmtN = n => String(Math.round(Math.abs(Number(n) || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        function fmtM(v, signe) {
            const x = Number(v) || 0, a = Math.abs(x);
            const s = a >= 1e9 ? (a / 1e9).toFixed(2).replace(".", ",") + " Md" : a >= 1e6 ? (a / 1e6).toFixed(2).replace(".", ",") + " M" : fmtN(a) + " cr";
            return signe ? (x > 0 ? "+ " : x < 0 ? "- " : "") + s : s;
        }
        function duree(sec) {
            sec = Math.max(0, Math.round(sec));
            const j = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
            if (j > 0) return j + " j " + h + " h";
            if (h > 0) return h + " h " + ("0" + m).slice(-2);
            if (m > 0) return m + " min " + ("0" + s).slice(-2) + " s";
            return s + " s";
        }
        const heure = iso => { const d = new Date(iso); return isNaN(d) ? "" : ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); };

        // rangs du jeu (memes tables que le mobile)
        const RANGS_COMMERCE = ["PENNILESS", "MOSTLY PENNILESS", "PEDDLER", "DEALER", "MERCHANT", "BROKER", "ENTREPRENEUR", "TYCOON", "ELITE", "ELITE I", "ELITE II", "ELITE III", "ELITE IV", "ELITE V"];
        // noms des vaisseaux (le journal donne le nom interne)
        const VAISSEAUX = { sidewinder: "Sidewinder", eagle: "Eagle", hauler: "Hauler", adder: "Adder", viper: "Viper Mk III", viper_mkiv: "Viper Mk IV", cobramkiii: "Cobra Mk III", cobramkiv: "Cobra Mk IV", cobramkv: "Cobra Mk V",
            type6: "Type-6 Transporter", type7: "Type-7 Transporter", type9: "Type-9 Heavy", type9_military: "Type-10 Defender", type8: "Type-8 Transporter", asp: "Asp Explorer", asp_scout: "Asp Scout", python: "Python",
            python_nx: "Python Mk II", diamondback: "Diamondback Scout", diamondbackxl: "Diamondback Explorer", empire_courier: "Imperial Courier", empire_eagle: "Imperial Eagle", empire_trader: "Imperial Clipper",
            federation_dropship: "Federal Dropship", federation_dropship_mkii: "Federal Assault Ship", federation_gunship: "Federal Gunship", federation_corvette: "Federal Corvette", independant_trader: "Keelback",
            ferdelance: "Fer-de-Lance", mamba: "Mamba", krait_mkii: "Krait Mk II", krait_light: "Krait Phantom", anaconda: "Anaconda", cutter: "Imperial Cutter", belugaliner: "Beluga Liner", orca: "Orca",
            dolphin: "Dolphin", typex: "Alliance Chieftain", typex_2: "Alliance Crusader", typex_3: "Alliance Challenger", panthermkii: "Panther Clipper Mk II", mandalay: "Mandalay", corsair: "Corsair" };
        const nomVaisseau = m => { const k = String(m || "").toLowerCase(); return VAISSEAUX[k] || (m ? String(m).charAt(0).toUpperCase() + String(m).slice(1) : ""); };
        const TYPES = { don: ["🤝", "Donation"], passagers: ["🧑‍🚀", "Passagers"], courrier: ["✉", "Courrier"], collecte: ["📦", "Collecte"], livraison: ["📦", "Livraison"], sauvetage: ["🛟", "Sauvetage"],
            minage: ["⛏", "Minage"], massacre: ["☠", "Massacre"], assassinat: ["🎯", "Assassinat"], exploration: ["🔭", "Exploration"], autre: ["📜", "Mission"] };
        const COUL_MARCH = ["#FFD700", "#00F0FF", "#00FF66", "#FF7100", "#FF4FD8", "#c9ccd1", "#7B8CFF", "#FF3333"];

        // ---------------------------------------------------------------
        //  LECTURE : ouverture, temps reel, relecture de secours
        // ---------------------------------------------------------------
        function appliquer(r) {
            if (!r || !r.etat || typeof r.etat !== "object") return;
            S = r.etat; MAJ = r.maj_le || null;
            rendre();
        }
        async function relire() {
            if (document.hidden && S) return;
            derniereLecture = Date.now();
            try {
                const { data, error } = await supabaseApp.rpc("live_lire");
                if (error) throw error;
                if (data && data.etat) appliquer(data); else if (!S) rendre();
            } catch (e) { console.error("Erreur tableau de bord :", e); if (!S) rendre(); }
        }
        function ecouter() {
            try {
                canal = supabaseApp.channel("tb-live-" + uid)
                    .on("postgres_changes", { event: "*", schema: "public", table: "session_live", filter: "user_id=eq." + uid }, p => {
                        derniereLecture = Date.now();
                        if (p && p.new && p.new.etat) appliquer({ etat: p.new.etat, maj_le: p.new.maj_le });
                    })
                    .subscribe(st => { rtOk = (st === "SUBSCRIBED"); });
            } catch (e) { console.error("Temps reel indisponible :", e); }
        }
        setInterval(() => {
            if (document.hidden) return;
            const age = Date.now() - derniereLecture;
            if ((!rtOk && age > 60000) || age > 600000) relire();
        }, 15000);
        document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - derniereLecture > 30000) relire(); });
        window.addEventListener("beforeunload", () => { try { if (canal) supabaseApp.removeChannel(canal); } catch (e) {} });

        // ---------------------------------------------------------------
        //  PAGE
        // ---------------------------------------------------------------
        function changerMode(m) {
            if (typeof sonClic === "function") sonClic();
            MODE = m; ecrire("edteam_tb_mode", m); rendre();
        }

        function rendre() {
            const zone = document.getElementById("display-area");
            if (!zone) return;
            if (S && FC.reprise) { FC.reprise = false; FC.statut = "EN_COURS"; FC.essais = 0; const jf = ++FC.jeton; interrogerFc(jf); }
            if (S && TOURNEE.reprise) { TOURNEE.reprise = false; TOURNEE.statut = "EN_COURS"; TOURNEE.essais = 0; const jt = ++TOURNEE.jeton; interroger(jt); }
            const haut = zone.scrollTop;
            let h = "";
            if (!S) {
                h = entete() + onglets() + `<div class="bloc cy"><h2>AUCUNE SESSION REÇUE <em>tableau de bord en jeu</em></h2>
                    <div class="tb-vide">Lancez Elite Dangerous avec EDMC et le plugin SYS.EDTEAM <b>2.9</b> (ou plus récent) : votre session apparaît ici toute seule, en direct, sans rien faire.<br>
                    <span class="tb-mut">Si le plugin est déjà à jour et que rien n'arrive, redémarrez EDMC puis changez de système en jeu.</span></div></div>`;
            } else {
                h = entete() + onglets() + alertes() + (MODE === "mis" ? panneauMissions() : panneauCommerce());
            }
            zone.innerHTML = h + `<div class="bloc-note" style="margin-top:14px;">ⓘ Source : le journal du jeu, lu par le plugin. Rien à saisir : ce tableau se remplit tout seul. Strictement personnel : personne d'autre ne voit votre session.</div>`;
            zone.scrollTop = haut;
            brancherSoute();
            tic();

        }

        function entete() {

            const vsx = S && (v.modele || v.nom) ? ` · ${esc(nomVaisseau(v.modele))}${v.nom ? " « " + esc(v.nom) + " »" : ""}` : "";
            const cr = S && S.credits != null ? ` · <span class="tb-gold">${fmtM(S.credits)}</span>` : "";
            return `<div class="tb-top"><div class="tb-cmdr">CMDR ${esc((profilCommandant && profilCommandant.cmdr_nom) || "")}<small>${lieu}${vsx}${cr}</small></div><span class="tb-live ${etatLive().classe}" id="tb-live"><i></i><span id="tb-live-txt">${etatLive().texte}</span></span></div>`;
        }
        function etatLive() {

            if (!S.en_ligne) return { classe: "off", texte: "HORS LIGNE · dernière session il y a " + duree(age) };
            if (age > 720) return { classe: "old", texte: "SANS NOUVELLES DEPUIS " + duree(age) };

        function onglets() {

            const g = (ic, nom) => `<button class="tb-tab off" title="À venir" disabled>${ic} ${nom}</button>`;
            return `<div class="tb-tabs">${t("com", "💰", "COMMERCE")}${t("mis", "📜", "MISSIONS")}${g("⛏", "MINAGE")}${g("⚔", "COMBAT")}${g("🔭", "EXPLORATION")}${g("🧬", "EXOBIOLOGIE")}</div>`;

        // ---------------------------------------------------------------

        function panneauCommerce() {

                ${(() => { const vh = venteHtml(); return vh ? `<div class="tb-grid2"><div class="bloc holo"><div class="holo-balayage"></div>${souteHtml()}</div><div>${vh}</div></div>` : `<div class="bloc holo" style="margin-bottom:12px;"><div class="holo-balayage"></div>${souteHtml()}</div>`; })()}

        }

        // soute : le cadre est rempli de caisses (capacite totale du vaisseau) ; unite automatique (la plus petite parmi 1, 2, 5, 10, 20, 50 t qui garde au plus 200 caisses)
        const SOUTE = { items: [], U: 1, N: 0 };
        function souteHtml() {
            const so = S.soute || {}, cap = Number(so.cap) || 0;
            const items = (so.items || []).filter(x => (Number(x.q) || 0) > 0);
            const total = items.reduce((a, x) => a + (Number(x.q) || 0), 0);
            if (!cap) return `<h2>CE QUE JE TRANSPORTE</h2><div class="tb-vide">Capacité de soute non encore relevée : elle arrive au prochain changement de vaisseau ou de modules en jeu.</div>`;
            const U = [1, 2, 5, 10, 20, 50].find(u => cap / u <= 200) || 50, N = Math.ceil(cap / U);
            let COLS = 22;
            for (let c = 14, pire = 1e9; c <= 30; c++) { const perte = Math.ceil(N / c) * c - N, ecart = Math.abs(c - 22); if (perte < pire || (perte === pire && ecart < Math.abs(COLS - 22))) { pire = perte; COLS = c; } }
            const ROWS = Math.ceil(N / COLS);
            SOUTE.items = items; SOUTE.U = U; SOUTE.N = N;
            const prop = [];
            items.forEach((x, i) => { const k = Math.max(1, Math.round((Number(x.q) || 0) / U)); for (let j = 0; j < k && prop.length < N; j++) prop.push(i); });
            let cases = "";
            for (let i = 0; i < ROWS * COLS; i++) {
                const r = ROWS - 1 - Math.floor(i / COLS), c = i % COLS;
                const pos = `grid-row:${r + 1};grid-column:${c + 1};`;
                if (i >= N) { cases += `<div class="tb-cr" style="${pos}visibility:hidden"></div>`; continue; }
                if (i < prop.length) { const it = items[prop[i]]; cases += `<div class="tb-cr f${it.m ? " m" : ""}" data-l="${prop[i]}" style="${pos}--cl:${COUL_MARCH[prop[i] % COUL_MARCH.length]}"></div>`; }
                else cases += `<div class="tb-cr" style="${pos}"></div>`;
            }
            const leg = items.map((x, i) => `<span data-i="${i}" style="--cl:${COUL_MARCH[i % COUL_MARCH.length]}"><i></i>${esc(x.n)} · ${fmtN(x.q)} t${x.m ? " (mission)" : ""}</span>`).join("");
            return `<h2>CE QUE JE TRANSPORTE <em>${fmtN(total)} / ${fmtN(cap)} t · ${Math.round(total / cap * 100)} % plein</em></h2>
                <div class="tb-grille" id="tb-grille" style="grid-template-columns:repeat(${COLS},1fr)">${cases}</div>
                ${items.length ? `<div class="tb-leg" id="tb-leg">${leg}</div>` : `<div class="tb-sub">Soute vide.</div>`}
                <div class="tb-cap"><span>1 caisse = ${U} t · ${N} caisses = capacité du vaisseau</span><span>survolez une caisse pour voir la marchandise</span></div>`;
        }
        function brancherSoute() {
            const g = document.getElementById("tb-grille"), leg = document.getElementById("tb-leg");
            if (!g) return;
            const tip = document.getElementById("tb-tip");
            let courant = null;
            const cases = Array.from(g.querySelectorAll(".tb-cr.f"));
            const hl = idx => { g.classList.toggle("dim", idx !== null); cases.forEach(x => x.classList.toggle("hl", idx !== null && x.dataset.l === String(idx))); };
            g.addEventListener("mouseover", e => {
                const x = e.target.closest(".tb-cr.f"); if (!x) return;
                if (x.dataset.l === courant) return;
                courant = x.dataset.l; hl(courant);
                const it = SOUTE.items[Number(courant)] || {};
                tip.innerHTML = `<b>${esc(it.n)}</b> · ${fmtN(it.q)} t${it.m ? "<br>cargaison de mission" : ""}${it.v ? "<br>volée" : ""}${it.paye ? "<br>prix moyen payé : " + fmtN(it.paye) + " cr/t" : ""}`;
                tip.style.display = "block";
            });
            g.addEventListener("mousemove", e => { tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px"; });
            g.addEventListener("mouseleave", () => { courant = null; hl(null); tip.style.display = "none"; });
            if (leg) {
                leg.addEventListener("mouseover", e => { const s = e.target.closest("span[data-i]"); if (s) hl(s.dataset.i); });
                leg.addEventListener("mouseleave", () => hl(null));
            }
        }
        function registreHtml() {
            const reg = (S.registre || []).slice().reverse();
            const lignes = reg.map(r => {
                const achat = r.k === "A";
                return `<tr><td>${heure(r.t)}</td><td class="${achat ? "tb-ach" : "tb-ven"}">${achat ? "ACHAT" : (r.nm ? "VENTE · MARCHÉ NOIR" : "VENTE")} · ${esc(r.n)}</td><td>${cp(r.s)}${r.y ? `<br><span class="tb-mut">${cp(r.y)}</span>` : ""}</td>
                    <td class="r">${fmtN(r.q)} t</td><td class="r">${fmtN(r.p)}</td><td class="r ${r.b >= 0 ? "tb-up" : "tb-down"}">${fmtM(r.b, true)}</td></tr>`;
            }).join("");
            return `<div class="bloc"><h2>REGISTRE DE LA SESSION <em>les 30 dernières opérations · bénéfice d'une vente = prix de vente − prix moyen payé</em></h2>
                ${reg.length ? `<table class="tb-table"><tr><th>HEURE</th><th>OPÉRATION</th><th>STATION</th><th class="r">QUANTITÉ</th><th class="r">PRIX / T</th><th class="r">RÉSULTAT</th></tr>${lignes}</table>` : `<div class="tb-vide">Aucun achat ni vente pour l'instant : le registre se remplit dès votre première opération.</div>`}</div>`;
        }

        // ---------------------------------------------------------------
        //  MISSIONS
        // ---------------------------------------------------------------
        const restant = m => m && m.exp ? (new Date(m.exp).getTime() - Date.now()) / 1000 : null;
        const urgence = s => s === null ? "ok" : s < 7200 ? "ko" : s < 43200 ? "wa" : "ok";
        const COUL_URG = { ko: "#FF3333", wa: "#FFD700", ok: "#00FF66" };
        function actionMission(m) {
            const lieu = m.st ? " à " + cp(m.st) : "";
            switch (m.type) {
                case "livraison": case "collecte": return "Livrer " + (m.march ? esc(m.march) : "la marchandise") + lieu;
                case "courrier": return "Remettre le courrier" + lieu;
                case "passagers": return "Déposer les passagers" + lieu;
                case "don": return "Faire la donation";
                default: return esc(m.nom || "Mission") + lieu;
            }
        }
        function panneauMissions() {
            const act = (S.missions || []).slice().sort((a, b) => String(a.exp || "9999").localeCompare(String(b.exp || "9999")));
            const fin = S.terminees || [];
            const encaisser = act.reduce((a, m) => a + (Number(m.rec) || 0), 0), connues = act.filter(m => m.rec != null).length;
            const prochaine = act.find(m => m.exp);
            const encaisse = fin.reduce((a, m) => a + (Number(m.rec) || 0), 0);
            const bandeau = `<div class="tb-grid4" style="grid-template-columns:repeat(4,1fr);">
                <div class="bloc"><h2>MISSIONS EN COURS</h2><div class="tb-big">${act.length}</div></div>
                <div class="bloc vert"><h2>TERMINÉES · SESSION</h2><div class="tb-big tb-up">${fin.length}</div><div class="tb-sub">${fmtM(encaisse)} encaissés</div></div>
                <div class="bloc or"><h2>À ENCAISSER</h2><div class="tb-big tb-gold">${encaisser ? "≈ " + fmtM(encaisser) : "—"}</div><div class="tb-sub">${connues} mission${connues > 1 ? "s" : ""} avec récompense connue</div></div>
                <div class="bloc cy"><h2>PROCHAINE ÉCHÉANCE</h2><div class="tb-big" ${prochaine ? `data-cd="${esc(prochaine.exp)}"` : ""}>${prochaine ? duree(restant(prochaine)) : "—"}</div><div class="tb-sub">${prochaine ? esc(prochaine.nom) : "aucune mission à échéance"}</div></div></div>`;
            if (!act.length) {
                return bandeau + `<div class="bloc cy" style="margin-bottom:14px;"><h2>MISSIONS EN COURS</h2><div class="tb-vide">Aucune mission en cours. Dès que vous en acceptez une, elle apparaît ici avec son échéance, sa destination et le trajet conseillé.</div></div>` + reputationHtml();
            }
            const plan = planTrajet(act);
            return bandeau + carteHtml(plan) + `<div class="tb-grid2"><div class="bloc"><h2>MISSIONS EN COURS <em>classées par échéance</em></h2>${act.map(carteMission).join("")}</div><div>${passageHtml(plan)}${reputationHtml()}</div></div>`;
        }
        function carteMission(m) {
            const [ic, lib] = TYPES[m.type] || TYPES.autre;
            const s = restant(m), u = urgence(s);
            const total = m.exp && m.t ? Math.max(60, (new Date(m.exp).getTime() - new Date(m.t).getTime()) / 1000) : null;
            const frac = s !== null && total ? Math.max(0, Math.min(1, s / total)) : 1;
            const meta = [`<span>${esc(lib)}</span>`, m.rec != null ? `<span>récompense ${fmtM(m.rec)}</span>` : "", m.q ? `<span>${m.type === "courrier" ? m.q + " colis" : "soute : " + fmtN(m.q) + " t"}</span>` : "", m.pas ? `<span>${m.pas} passager${m.pas > 1 ? "s" : ""}</span>` : "",
                m.don ? `<span>don : ${fmtM(m.don)}</span>` : "", m.rep ? `<span>réputation ${esc(m.rep)}</span>` : "", m.inf ? `<span>influence ${esc(m.inf)}</span>` : ""].join("");
            return `<div class="tb-ms ${u}"><div class="ic">${ic}</div><div><div class="ti">${esc(m.nom || lib)}</div>
                <div class="sb">${cp(m.faction || "")}${m.sys ? ` · <span class="lx">${cp(m.sys)}</span>${m.st ? " / " + cp(m.st) : ""}` : " · aucun trajet"}</div><div class="mt">${meta}</div></div>
                <div class="tb-cd">${s === null ? "" : `<svg viewBox="0 0 44 44" width="52" height="52"><circle cx="22" cy="22" r="18" fill="none" stroke="#1d2226" stroke-width="5"/><circle cx="22" cy="22" r="18" fill="none" stroke="${COUL_URG[u]}" stroke-width="5" stroke-dasharray="113.1" stroke-dashoffset="${(113.1 * (1 - frac)).toFixed(1)}" transform="rotate(-90 22 22)" data-ring="${esc(m.exp)}" data-t="${esc(m.t || "")}"/></svg><b data-cd="${esc(m.exp)}">${duree(s)}</b>`}</div></div>`;
        }
        // ---------------------------------------------------------------
        //  TRAJET DES MISSIONS : vraies distances entre systemes (coordonnees EDSM, comme bgs.html : appel du navigateur, garde en memoire locale)
        //  L'ordre de passage minimise la DISTANCE totale a parcourir (l'echeance est deja visible a gauche : c'est au pilote d'y faire attention).
        // ---------------------------------------------------------------
        const COORDS = (() => { try { return JSON.parse(lire("edteam_tb_coords") || "{}"); } catch (e) { return {}; } })();
        let coordsEnCours = false, coordsPause = 0;
        const cle = n => String(n || "").toLowerCase();
        function demandeCoords(noms) {
            const manquants = [...new Set(noms.filter(n => n && !(cle(n) in COORDS)))].slice(0, 15);
            if (!manquants.length || coordsEnCours || Date.now() < coordsPause) return;
            coordsEnCours = true;
            const url = "https://www.edsm.net/api-v1/systems?showCoordinates=1&" + manquants.map(n => "systemName[]=" + encodeURIComponent(n)).join("&");
            fetch(url).then(r => r.json()).then(arr => {
                manquants.forEach(n => {
                    const f = (Array.isArray(arr) ? arr : []).find(x => x && cle(x.name) === cle(n));
                    COORDS[cle(n)] = f && f.coords ? [Number(f.coords.x), Number(f.coords.y), Number(f.coords.z)] : false;   // false = inconnu d'EDSM : on ne redemande pas
                });
                ecrire("edteam_tb_coords", JSON.stringify(COORDS));
            }).catch(() => { coordsPause = Date.now() + 60000; }).finally(() => { coordsEnCours = false; rendre(); });
        }
        const dist3 = (a, b) => Math.sqrt((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2);
        // regroupement par systeme de destination
        function groupes(act) {
            const ordre = [], par = {};
            act.forEach(m => {
                const sys = m.sys || "";
                if (!sys) return;
                if (!par[sys]) { par[sys] = { sys, ms: [], exp: m.exp || "9999" }; ordre.push(par[sys]); }
                par[sys].ms.push(m);
                if (m.exp && m.exp < par[sys].exp) par[sys].exp = m.exp;
            });
            return ordre;
        }
        // meilleur ordre de visite (distance totale la plus courte, depuis la position du pilote) : essai de toutes les combinaisons jusqu'a 8 systemes, sinon plus proche voisin
        function meilleurOrdre(depart, pts) {
            const n = pts.length;
            if (n <= 1) return pts.map((_, i) => i);
            if (n > 8) {
                const reste = pts.map((_, i) => i), res = []; let cur = depart;
                while (reste.length) { let b = 0; reste.forEach((k, j) => { if (dist3(cur, pts[k]) < dist3(cur, pts[reste[b]])) b = j; }); const k = reste.splice(b, 1)[0]; res.push(k); cur = pts[k]; }
                return res;
            }
            let meilleur = null, mDist = Infinity;
            (function rec(cur, restes, chemin, d) {
                if (d >= mDist) return;
                if (!restes.length) { mDist = d; meilleur = chemin.slice(); return; }
                restes.forEach((k, j) => { const r2 = restes.slice(); r2.splice(j, 1); chemin.push(k); rec(pts[k], r2, chemin, d + dist3(cur, pts[k])); chemin.pop(); });
            })(depart, pts.map((_, i) => i), [], 0);
            return meilleur;
        }
        function planTrajet(act) {
            const g = groupes(act), depart = S.systeme || "";
            demandeCoords(g.map(x => x.sys).concat(depart ? [depart] : []));
            const posDep = (S.pos && S.pos.length === 3) ? S.pos : (COORDS[cle(depart)] || null);
            const saut = Math.max(8, sautUtilise());
            const ici = g.filter(x => cle(x.sys) === cle(depart));
            const avec = g.filter(x => cle(x.sys) !== cle(depart) && COORDS[cle(x.sys)]);
            const sans = g.filter(x => cle(x.sys) !== cle(depart) && !COORDS[cle(x.sys)]);
            let arrets = [];
            ici.forEach(x => arrets.push({ ...x, pos: posDep, d: 0, sauts: 0 }));
            if (posDep && avec.length) {
                const pts = avec.map(x => COORDS[cle(x.sys)]);
                const ord = meilleurOrdre(posDep, pts);
                let cur = posDep;
                ord.forEach(k => { const p = pts[k], d = dist3(cur, p); arrets.push({ ...avec[k], pos: p, d, sauts: Math.max(1, Math.ceil(d / saut)) }); cur = p; });
            } else {
                avec.sort((a, b) => String(a.exp).localeCompare(String(b.exp))).forEach(x => arrets.push({ ...x, pos: COORDS[cle(x.sys)], d: null, sauts: null }));
            }
            sans.forEach(x => arrets.push({ ...x, pos: null, d: null, sauts: null }));
            arrets.forEach(a => { a.min = a.sauts === null ? null : a.sauts * 0.9 + (a.sauts ? 2 : 0) + 3; });     // sauts + approche + amarrage : ESTIMATION
            const total = arrets.reduce((t, a) => ({ d: t.d + (a.d || 0), sauts: t.sauts + (a.sauts || 0), min: t.min + (a.min || 0) }), { d: 0, sauts: 0, min: 0 });
            return { depart: { sys: depart, pos: posDep }, arrets, total, complet: !!posDep && !sans.length && !avec.some(x => !COORDS[cle(x.sys)]) };
        }
        // carte : vraie position des systemes (vue du dessus), parcours dans l'ordre de passage
        function carteHtml(plan) {
            if (!plan.arrets.length) return "";

                    <li>Remplir le FC : acheter <b>${fmtN(vol)} t de ${nom}</b> à <b>${cp(a.station)}</b> (${fmtN(a.prix)} cr/t).</li>
                    <li>Faire sauter le FC vers <b>${cp(v.systeme)}</b> (${esc(String(v.distance))} al).</li>
                    <li>Vendre à <b>${cp(v.station)}</b> (${fmtN(v.prix)} cr/t) : gain estimé <b class="tb-up">${fmtM(r.benefice, true)}</b>.</li></ol></div>`;
        }
        function fcAutre(r, i) {
            const a = r.achat || {}, v = r.vente || {};
            return `<div class="tb-fcautre"><span class="rg">${i}</span><b class="nomc">${esc(nomFr(r.nom))}${(r.alertes || []).length ? ` <span class="tb-vx" title="${esc((r.alertes || []).join(" · "))}">⚠</span>` : ""}</b><span>${fmtN(r.volume)} t</span>
                <span class="tr">${cp(a.systeme)} <small>(${fmtN(a.prix)} cr/t)</small> <i>━►</i> ${cp(v.systeme)} <small>(${fmtN(v.prix)} cr/t · ${esc(String(v.distance))} al)</small></span><b class="tb-up">${fmtM(r.benefice, true)}</b></div>`;
        }

        // ---------------------------------------------------------------
        //  VENDRE CE QUE JE TRANSPORTE (script SQL 79, rpc vente_soute) : pour chaque marchandise en soute, les meilleures stations acheteuses autour du pilote,
        //  quelle que soit l'origine de la marchandise. Se lance TOUT SEUL quand la soute ou la position change (au plus une recherche toutes les 20 s) ; memoire de 15 min cote serveur.
        // ---------------------------------------------------------------
        const VENTE = { statut: "vide", donnees: null, message: "", essais: 0, minuteur: null, relance: null, jeton: 0, sig: "", dernier: 0, enAttente: null, force: false, rayon: [20, 40, 80, 120].includes(Number(lire("edteam_tb_rayon"))) ? Number(lire("edteam_tb_rayon")) : 40 };
        const PALIERS_Q = [10, 25, 50, 100, 250, 500, 1000, 2500, 5000];
        const palierQ = q => PALIERS_Q.find(p => p >= q) || 5000;
        // noms internes du journal qui ne se rapprochent pas tout seuls de ceux de Spansh (le prefixe « usscargo » est retire : usscargoblackbox -> blackbox)
        const ALIAS_K = { occupiedcryopod: "occupiedescapepod", comercialsamples: "commercialsamples" };
        const cleSpansh = k => { const c = String(k || "").toLowerCase().replace(/^usscargo/, ""); return ALIAS_K[c] || c; };
        // marchandises dont on peut chercher un acheteur : ni cargaison de mission, ni limpets
        const vendables = () => ((S && S.soute && S.soute.items) || []).filter(x => (Number(x.q) || 0) > 0 && !x.m && String(x.k || "").toLowerCase() !== "drones");
        const sansCle = () => vendables().some(x => !x.k);
        function signatureVente() {
            const it = vendables().filter(x => x.k).map(x => cleSpansh(x.k) + ":" + palierQ(Number(x.q))).sort().join(",");
            return it ? [S.systeme || "", REGL.heures, REGL.grande ? 1 : 0, VENTE.rayon, it].join("|") : "";
        }
        function rayonVente(v) {
            VENTE.rayon = v; ecrire("edteam_tb_rayon", String(v));
            if (typeof sonClic === "function") sonClic();
            rendre();       // pas de recherche automatique : le bouton « chercher » relance
        }
        // Ce cadre sert UNIQUEMENT quand le pilote a des marchandises dont il ne sait pas ou les vendre (boites noires, capsules, echantillons...) : AUCUNE recherche automatique,
        // il faut cliquer. (Une tournee ou un commerce de FC n'ont pas besoin de lui : zero requete, zero egress tant qu'on ne clique pas.)
        function lancerVente() {
            if (!S || !signatureVente()) return;
            if (typeof sonClic === "function") sonClic();
            VENTE.sig = signatureVente(); VENTE.dernier = Date.now();
            const jeton = ++VENTE.jeton; clearTimeout(VENTE.minuteur);
            VENTE.statut = "EN_COURS"; VENTE.essais = 0; VENTE.message = "";
            rendre();
            interrogerVente(jeton);
        }
        function declencherVente() { /* plus de recherche automatique (voir ci-dessus) */ }
        async function interrogerVente(jeton) {
            if (jeton !== VENTE.jeton || !S) return;
            const items = vendables().filter(x => x.k).map(x => ({ k: cleSpansh(x.k), q: palierQ(Number(x.q)) }));
            let r;
            try { r = await supabaseApp.rpc("vente_soute", { p_systeme: S.systeme, p_items: items, p_rayon: VENTE.rayon, p_grande: REGL.grande, p_heures: REGL.heures }); } catch (e) { r = { error: { message: "Connexion impossible." } }; }
            if (jeton !== VENTE.jeton) return;
            if (r.error || !r.data) { VENTE.statut = "ERREUR"; VENTE.message = (r.error && r.error.message) || "Réponse vide."; rendre(); return; }
            const j = r.data;
            if (j.statut === "PRET") { VENTE.statut = "PRET"; VENTE.donnees = j.donnees; VENTE.calcule = j.calcule_le; rendre(); return; }
            if (j.statut === "ERREUR") { VENTE.statut = "ERREUR"; VENTE.message = j.message || "Recherche impossible pour le moment."; rendre(); return; }
            if (++VENTE.essais > 30) { VENTE.statut = "ERREUR"; VENTE.message = "La recherche prend trop de temps : réessayez dans quelques minutes."; rendre(); return; }
            rendre();
            VENTE.minuteur = setTimeout(() => interrogerVente(jeton), Math.min(4000 + VENTE.essais * 400, 10000));
        }
        function venteHtml() {
            const items = vendables();
            if (!items.length) return "";       // rien a chercher : le cadre n'apparait pas
            const perime = !!(VENTE.donnees && VENTE.sig !== signatureVente());
            const enCours = VENTE.statut === "EN_COURS";
            const seg = `<span class="tb-seg">${[20, 40, 80, 120].map(v => `<button type="button" class="${v === VENTE.rayon ? "on" : ""}" onclick="rayonVente(${v})">${v}</button>`).join("")}</span>`;
            const bouton = `<button type="button" class="tb-btn" ${enCours || sansCle() ? "disabled" : ""} onclick="lancerVente()">${VENTE.donnees ? "↻ CHERCHER À NOUVEAU" : "▶ CHERCHER OÙ VENDRE"}</button>`;
            const puces = items.map(x => `<span class="tb-puce">${esc(x.n)} · ${fmtN(x.q)} t</span>`).join("");
            let corps = "";
            if (sansCle()) corps = `<div class="tb-banner">Le plugin de votre ordinateur ne transmet pas encore le nom interne des marchandises : mettez SYS_EDTEAM à jour et relancez EDMC.</div>`;
            else if (VENTE.statut === "ERREUR") corps = `<div class="tb-banner">${esc(VENTE.message)}</div>`;
            else if (enCours && !VENTE.donnees) corps = `<div class="tb-attente"><span class="tb-spin"></span><div><b>Recherche des meilleures stations…</b><span>quelques secondes</span></div></div>`;
            else if (!VENTE.donnees) corps = `<div class="tb-invite"><div><b>Vous ne savez pas où vendre quelque chose ?</b><span>Boîtes noires, capsules, échantillons… Le tableau de bord cherche les meilleures stations autour de ${cp(S.systeme || "?")} pour ce que vous transportez. Aucune recherche ne part tant que vous ne cliquez pas.</span><div class="tb-puces">${puces}</div></div></div>`;
            if (VENTE.donnees && !sansCle()) {
                const res = {}; (VENTE.donnees.items || []).forEach(x => { res[x.k] = x; });
                const maj = enCours ? `<div class="tb-sub" style="margin-bottom:8px;"><span class="tb-spin" style="width:10px;height:10px;border-width:2px;vertical-align:-1px;margin-right:6px;"></span>mise à jour…</div>` : "";
                const vieux = perime && !enCours ? `<div class="tb-banner">La soute, la position ou les réglages ont changé depuis la dernière recherche : cliquez sur « CHERCHER À NOUVEAU ».</div>` : "";
                corps += maj + vieux + items.filter(x => x.k).map(x => blocMarchandise(x, res[cleSpansh(x.k)])).join("");
            }
            return `<div class="bloc or"><h2>VENDRE CE QUE JE TRANSPORTE <em>autour de ${cp(S.systeme || "?")} · ${seg} al</em></h2><div class="tb-barre" style="margin-bottom:10px;padding-bottom:10px;"><span class="tb-mut" style="font-size:.85em;">à utiliser quand vous ne savez pas où vendre une marchandise</span><div class="tb-cta">${bouton}</div></div>${corps}
                <div class="bloc-note">Meilleures stations qui <b>achètent</b> chaque marchandise de la soute (demande suffisante pour toute la quantité), d'après les relevés des joueurs de moins de ${REGL.heures === 24 ? "1 jour" : REGL.heures / 24 + " jours"} (réglage de la feuille de route). Les prix sont ceux du relevé indiqué : vérifiez-les à l'arrivée.</div></div>`;
        }
        function blocMarchandise(x, r) {
            const q = Number(x.q) || 0, paye = Number(x.paye) || 0;
            const tete = `<div class="tete"><b>${esc(x.n)}</b><span>${fmtN(q)} t</span>${paye ? `<span class="tb-mut">payé ${fmtN(paye)} cr/t en moyenne</span>` : ""}</div>`;
            if (!r) return `<div class="tb-vm">${tete}<div class="rien">recherche en cours…</div></div>`;
            if (r.inconnue) return `<div class="tb-vm">${tete}<div class="rien">Marchandise inconnue de Spansh : impossible de trouver un acheteur.</div></div>`;
            const c = r.candidats || [];
            if (!c.length) return `<div class="tb-vm">${tete}<div class="rien">Aucune station proche n'achète ${fmtN(q)} t de ${esc(x.n)} dans ce rayon avec ces relevés. Essayez un rayon plus grand ou des relevés plus anciens.</div></div>`;
            const lignes = c.slice(0, 4).map((s, i) => {
                const total = s.prix * q, gain = paye ? (s.prix - paye) * q : null;
                return `<div class="cd${i === 0 ? " best" : ""}"><span class="st"><b>${cp(s.station)}</b><small>${cp(s.systeme)} · ${s.distance > 0 ? esc(String(s.distance)) + " al" : "même système"} · ${fmtN(s.arrivee)} Ls${s.grande ? "" : " · petite piste"}</small></span>
                    <span class="px">${fmtN(s.prix)} <small>cr/t</small></span>
                    <span class="gn"><b class="tb-up">${fmtM(total)}</b><small>${gain === null ? "pour " + fmtN(q) + " t" : (gain >= 0 ? "+ " : "− ") + fmtM(Math.abs(gain)) + " vs payé"}</small></span>
                    <span class="ag"><small>demande ${fmtN(s.demande)} t</small>${fraicheur(s.maj)}</span></div>`;
            }).join("");
            return `<div class="tb-vm">${tete}${lignes}</div>`;
        }

        // ---------------------------------------------------------------
        //  HORLOGE : decomptes et duree de jeu, chaque seconde, sans requete
        // ---------------------------------------------------------------
        function tic() {
            const live = document.getElementById("tb-live");
            if (live) { const e = etatLive(); live.className = "tb-live " + e.classe; document.getElementById("tb-live-txt").textContent = e.texte; }
            const d = document.getElementById("tb-duree");
            if (d && S && S.debut && S.en_ligne) d.textContent = duree((Date.now() - new Date(S.debut).getTime()) / 1000);
            document.querySelectorAll("[data-cd]").forEach(el => { const s = (new Date(el.dataset.cd).getTime() - Date.now()) / 1000; el.textContent = s <= 0 ? "expirée" : duree(s); });
            document.querySelectorAll("circle[data-ring]").forEach(c => {
                const fin = new Date(c.dataset.ring).getTime(), t0 = c.dataset.t ? new Date(c.dataset.t).getTime() : NaN;
                const total = !isNaN(t0) ? Math.max(60000, fin - t0) : null;
                if (total) c.setAttribute("stroke-dashoffset", (113.1 * (1 - Math.max(0, Math.min(1, (fin - Date.now()) / total)))).toFixed(1));
            });
        }
        setInterval(tic, 1000);

        // ---------------------------------------------------------------
        //  DEMARRAGE (tout pilote approuve : la session est strictement personnelle)
        // ---------------------------------------------------------------
        window.addEventListener("load", async () => {
            const { data: { session } } = await supabaseApp.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }
            const { data } = await chargerProfilAvecCache(supabaseApp, session.user.id);
            if (data && data.est_approuve) {
                profilCommandant = data; window.profilCommandant = data; uid = session.user.id;
                if (data.est_amiral || data.est_directeur) {
                    const navAmiraute = document.getElementById("nav-bureau-amiraute");
                    if (navAmiraute) navAmiraute.style.display = "flex";
                    if (typeof actualiserBadgeAmiraute === "function") actualiserBadgeAmiraute();
                }
                const navBgs = document.getElementById("nav-bgs-factions");
                if (navBgs && lire("edteam_acces_bgs") === "true") navBgs.style.display = "flex";
                if (typeof window.actualiserHeader === "function") window.actualiserHeader(data);
                const apiKeyDisplay = document.getElementById("api-key-display");
                if (apiKeyDisplay) apiKeyDisplay.innerText = data.cle_api;
                const mainUi = document.getElementById("main-ui");
                if (mainUi) { mainUi.style.display = "flex"; mainUi.style.opacity = "1"; }
                if (typeof window.demarrerSystemLoop === "function") window.demarrerSystemLoop();
                await relire();
                ecouter();
            } else {
                await supabaseApp.auth.signOut();
                window.location.href = "index.html";
            }
        });

    </script>
